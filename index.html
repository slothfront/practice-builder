    <div class="card">
      <div class="form-row">
        <label>ドリル名 <span class="hint">（必須）</span></label>
        <input type="text" id="cf-name" value="${escapeHtml(ed.name || '')}" placeholder="例：スリーメン応用">

      <div class="form-row-2col">
        <div class="form-row">
          <label>ジャンル</label>

        </div>
        <div class="form-row">
          <label>カテゴリ</label>
          <input type="text" id="cf-category" value="${escapeHtml(ed.category || '')}" placeholder="例：ディグ実戦">
        </div>
      </div>
      <div class="form-row">
        <label>目的 <span class="hint">（短く）</span></label>
        <input type="text" id="cf-purpose" value="${escapeHtml(ed.purpose || '')}" placeholder="例：移動を伴う連続レシーブで反応速度を養う">
      </div>
      <div class="form-row-2col">
        <div class="form-row">
          <label>難易度</label>
          <select id="cf-difficulty">${diffOpts}</select>
        </div>
        <div class="form-row">
          <label>最少人数</label>
          <input type="number" id="cf-min-people" min="1" max="20" value="${ed.min_people || 4}">
        </div>
      </div>
      <div class="form-row-2col">
        <div class="form-row">
          <label>必要スペース</label>
          <select id="cf-space">${spaceOpts}</select>
        </div>
        <div class="form-row">
          <label>所要時間（分）</label>
          <input type="number" id="cf-duration" min="1" max="60" value="${ed.duration || 10}">
        </div>
      </div>
      <div class="form-row">
        <label>必要器具</label>
        <input type="text" id="cf-equipment" value="${escapeHtml(ed.equipment || '')}" placeholder="例：ボール多数、コーン3個">
      </div>
      <div class="form-row">
        <label>やり方（手順）</label>
        <textarea id="cf-howto" placeholder="①〜&#10;②〜&#10;③〜">${escapeHtml(ed.how_to || '')}</textarea>
      </div>
      <div class="form-row">
        <label>コーチングポイント</label>
        <textarea id="cf-points" placeholder="・〜&#10;・〜">${escapeHtml(ed.coaching_points || '')}</textarea>
      </div>
      <div class="form-row" style="margin-bottom:0">
        <label>バリエーション <span class="hint">（任意）</span></label>
        <textarea id="cf-variations" placeholder="難易度を上げる方法など">${escapeHtml(ed.variations || '')}</textarea>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn primary large" data-action="save-custom">▶ ${isEdit ? '更新する' : '保存する'}</button>
      ${isEdit ? `<button class="btn small danger" data-delete-custom="${ed.id}">× 削除</button>` : ''}
    </div>
  `;
}

function renderHistory() {
  const list = state.history.slice().sort((a, b) => (b.saved_at || '').localeCompare(a.saved_at || ''));
  return `
    <button class="back-btn" data-go="home">← BACK</button>
    <h2>HISTORY</h2>
    <p style="margin-bottom:14px;font-size:13px;color:var(--text-secondary)">${list.length}件の練習を保存中。タップで詳細・振り返りが見られます。</p>
    <div class="btn-row" style="margin-bottom:14px">
      <button class="btn small" data-action="export-history">⇩ 履歴をエクスポート</button>
      <button class="btn small" data-action="import-history">⇧ インポート</button>
    </div>
    ${list.length === 0 ? `
      <div class="empty-state">
        <div class="big">EMPTY</div>
        <p>編集画面で「📅 履歴に保存」を押すと、ここに追加されます。</p>
      </div>
    ` : `
      <div class="menu-list">
        ${list.map((h, i) => renderHistoryCard(h, i)).join('')}
      </div>
    `}
  `;
}

function renderHistoryCard(h, i) {
  const dateStr = h.saved_at ? new Date(h.saved_at).toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
  const total = (h.menu || []).reduce((s, id) => s + (getDrill(id)?.duration || 0), 0);
  const reviewed = h.review && (h.review.overall_note || Object.keys(h.review.drills || {}).length > 0);
  return `
    <div class="history-card" data-view-history="${h.id}">
      <div class="h-num">${(i + 1).toString().padStart(2,'0')}</div>
      <div class="h-body">
        <div class="h-name">${escapeHtml(h.name || '無題のメニュー')} ${reviewed ? '<span class="badge-reviewed">振り返り済み</span>' : ''}</div>
        <div class="h-meta">
          <span>${escapeHtml(dateStr)}</span>
          <span>${(h.menu || []).length}種目</span>
          <span>${total}分</span>
          ${h.filters && h.filters.dayType ? `<span>${h.filters.dayType === 'weekday' ? '平日' : '休日'}</span>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderHistoryDetail() {
  const h = state.history.find(x => x.id === state.viewingHistoryId);
  if (!h) { state.view = 'history'; return ''; }
  const review = h.review || { overall_note: '', drills: {} };
  const dateStr = h.saved_at ? new Date(h.saved_at).toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
  const total = (h.menu || []).reduce((s, id) => s + (getDrill(id)?.duration || 0), 0);
  const totalActual = (h.menu || []).reduce((s, id) => s + (review.drills?.[id]?.actual_duration || 0), 0);
  
  let listHtml = '';
  (h.menu || []).forEach((id, idx) => {
    const d = getDrill(id);
    if (!d) return;
    const r = review.drills?.[id] || {};
    const sato = isSato(d);
    const custom = isCustom(d);
    listHtml += `
      <div class="drill-card">
        <div class="drill-num">${(idx + 1).toString().padStart(2,'0')}</div>
        <div class="drill-body">
          <div class="drill-genre-row">
            <span class="genre-chip">${escapeHtml(d.genre)}</span>
            <span class="cat-chip">${escapeHtml(d.category || '')}</span>
            ${sato ? '<span class="badge-sato">定番</span>' : ''}
            ${custom ? '<span class="badge-custom">自作</span>' : ''}
          </div>
          <div class="drill-name">${escapeHtml(d.name)}</div>
          <div class="drill-meta">
            <span class="meta-tag time">予定 ${d.duration || '?'}分</span>
            ${r.actual_duration ? `<span class="meta-tag" style="background:var(--blue);color:var(--paper);font-family:'Archivo Black',sans-serif">実 ${r.actual_duration}分</span>` : ''}
          </div>
          <div class="review-block">
            <div class="review-row">
              <span class="review-label">実時間</span>
              <input type="number" min="0" max="120" value="${r.actual_duration || ''}" data-review-time="${id}" placeholder="分">
            </div>
            <div class="review-row" style="align-items:flex-start">
              <span class="review-label" style="padding-top:6px">手応え</span>
              <textarea data-review-note="${id}" placeholder="メモ・気づき・改善点など">${escapeHtml(r.note || '')}</textarea>
            </div>
          </div>
        </div>
      </div>
    `;
  });
  
  return `
    <button class="back-btn" data-go="history">← BACK</button>
    <h2>${escapeHtml(h.name || '無題のメニュー')}</h2>
    <p style="margin-bottom:14px;font-size:13px;color:var(--text-secondary)">${escapeHtml(dateStr)}</p>
    <div class="summary-bar">
      <div class="item"><span class="label">種目</span><span class="val">${(h.menu || []).length}</span></div>
      <div class="item"><span class="label">予定</span><span class="val">${total}分</span></div>
      <div class="item"><span class="label">実合計</span><span class="val ${totalActual > 0 ? 'warn' : ''}">${totalActual || '-'}${totalActual > 0 ? '分' : ''}</span></div>
    </div>
    <div class="card">
      <div class="form-row" style="margin-bottom:0">
        <label>全体メモ <span class="hint">（練習全体の振り返り）</span></label>
        <textarea id="hd-overall-note" placeholder="今日の練習全体の手応え・反省・次回への課題">${escapeHtml(review.overall_note || '')}</textarea>
      </div>
    </div>
    <div class="btn-row" style="margin-bottom:18px">
      <button class="btn primary small" data-action="save-review">💾 振り返りを保存</button>
      <button class="btn small" data-action="reuse-history">↻ このメニューを再利用</button>
      <button class="btn small danger" data-action="delete-history">× 履歴から削除</button>
    </div>
    <div class="menu-list">${listHtml}</div>
  `;
}

function renderModal() {
  const m = state.modal;
  if (!m) return '';
  if (m.type === 'alt') {
    const orig = getDrill(state.menu[m.idx]);
    if (!orig) return '';
    let alts = getAlternatives(orig.id, state.menu, state.filters, m.excluded || []);
    alts = sortSatoFirst(alts);
    const remaining = countRemainingAlternatives(orig.id, state.menu, state.filters, [...(m.excluded||[]), ...alts.map(a=>a.id)]);
    return `
      <div class="modal-bg" data-close-modal="1">
        <div class="modal" data-no-close="1">
          <div class="modal-header">
            <div>
              <div class="modal-title">ALTERNATIVES</div>
              <div class="modal-sub">いまの「${escapeHtml(orig.name)}」と比べて</div>
            </div>
            <button class="close-btn" data-close-modal="1">×</button>
          </div>
          ${alts.length === 0 ? `
            <p style="font-size:13px;margin-bottom:14px">${(m.excluded && m.excluded.length > 0) ? 'これ以上の候補はありません' : '条件に合う別案が見つかりませんでした'}。</p>
            ${(m.excluded && m.excluded.length > 0) ? `<button class="btn small" data-action="reset-alt-excluded">↻ 最初の候補に戻る</button>` : ''}
          ` : `
            <div class="alt-grid">
              ${alts.map(a => `
                <div class="alt-card" data-replace-with="${a.id}" data-replace-idx="${m.idx}">
                  <div class="alt-name">
                    ${isSato(a) ? '<span class="badge-sato">定番</span>' : ''}
                    ${isCustom(a) ? '<span class="badge-custom">自作</span>' : ''}
                    ${escapeHtml(a.name)}
                  </div>
                  <div class="alt-meta">
                    <span class="genre-chip">${escapeHtml(a.genre)}</span>
                    <span class="cat-chip">${escapeHtml(a.category || '')}</span>
                    <span class="meta-tag diff">${escapeHtml(a.difficulty || '')}</span>
                    <span class="meta-tag time">${a.duration || '?'}分</span>
                  </div>
                  <div class="alt-purpose">${escapeHtml(a.purpose || '')}</div>
                  <div class="alt-compare">${compareTagsHtml(orig, a)}</div>
                </div>
              `).join('')}
            </div>
            <div class="btn-row" style="margin-top:14px">
              ${remaining > 0
                ? `<button class="btn small" data-action="next-alt-batch">↻ 別の候補を見る <span style="font-family:'DM Mono',monospace;font-size:10px;opacity:0.7;margin-left:4px">残り${remaining}件</span></button>`
                : `<button class="btn small" disabled>これ以上候補なし</button>`}
              ${(m.excluded && m.excluded.length > 0) ? `<button class="btn small" data-action="reset-alt-excluded">↺ 最初に戻る</button>` : ''}
            </div>
          `}
        </div>
      </div>
    `;
  }
  if (m.type === 'add') {
    const q = m.query || '';
    const filterGenre = m.genre || '';
    let pool = ALL_DRILLS.filter(d => !state.menu.includes(d.id));
    if (filterGenre) pool = pool.filter(d => d.genre === filterGenre);
    if (q) {
      const ql = q.toLowerCase();
      pool = pool.filter(d => (d.name || '').toLowerCase().includes(ql) || (d.purpose || '').toLowerCase().includes(ql));
    }
    pool = sortSatoFirst(pool).slice(0, 60);
    const genreOpts = ['', ...GENRES].map(g => `<option value="${g}" ${filterGenre===g?'selected':''}>${g || '全ジャンル'}</option>`).join('');
    return `
      <div class="modal-bg" data-close-modal="1">
        <div class="modal" data-no-close="1">
          <div class="modal-header">
            <div>
              <div class="modal-title">ADD DRILL</div>
              <div class="modal-sub">${m.insertAt === 0 ? '先頭' : m.insertAt + '番目の後'}に追加</div>
            </div>
            <button class="close-btn" data-close-modal="1">×</button>
          </div>
          <div class="filter-bar" style="margin-bottom:14px">
            <input type="text" class="search" id="add-q" placeholder="検索..." value="${escapeHtml(q)}">
            <select id="add-genre">${genreOpts}</select>
          </div>
          <p style="margin-bottom:10px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase">該当：${pool.length}件（最大60件）</p>
          <div class="alt-grid">
            ${pool.map(d => `
              <div class="alt-card" data-insert-id="${d.id}">
                <div class="alt-name">
                  ${isSato(d) ? '<span class="badge-sato">定番</span>' : ''}
                  ${escapeHtml(d.name)}
                </div>
                <div class="alt-meta">
                  <span class="genre-chip">${escapeHtml(d.genre)}</span>
                  <span class="cat-chip">${escapeHtml(d.category || '')}</span>
                  <span class="meta-tag diff">${escapeHtml(d.difficulty || '')}</span>
                  <span class="meta-tag time">${d.duration || '?'}分</span>
                </div>
                <div class="alt-purpose">${escapeHtml(d.purpose || '')}</div>
              </div>
            `).join('')}
            ${pool.length === 0 ? '<p style="font-size:13px">該当するドリルがありません。</p>' : ''}
          </div>
        </div>
      </div>
    `;
  }
  return '';
}

// ========== イベントリスナー ==========
function attachListeners() {
  document.querySelectorAll('[data-pick-genre]').forEach(el => {
    el.onclick = () => {
      state.manual.selectedGenre = el.dataset.pickGenre;
      state.manual.q = ''; state.manual.cat = '';
      state.view = 'manual-pick';
      render(); window.scrollTo(0, 0);
    };
  });
  document.querySelectorAll('[data-remove-by-id]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.removeById;
      const i = state.menu.indexOf(id);
      if (i >= 0) {
        state.menu.splice(i, 1);
        delete state.menuStepMap[id];
        saveLastMenu({ menu: state.menu, filters: state.filters, stepMap: state.menuStepMap, parallel: state.menuParallel });
        render();
      }
    };
  });
  const mq = document.getElementById('manual-q');
  if (mq) {
    mq.oninput = (e) => {
      state.manual.q = e.target.value;
      render();
      setTimeout(() => { const x = document.getElementById('manual-q'); if(x) { x.focus(); x.setSelectionRange(x.value.length, x.value.length); } }, 0);
    };
  }
  const mc = document.getElementById('manual-cat');
  if (mc) mc.onchange = (e) => { state.manual.cat = e.target.value; render(); };

  document.querySelectorAll('[data-go]').forEach(el => {
    el.onclick = () => { state.view = el.dataset.go; state.expandedId = null; render(); window.scrollTo(0, 0); };
  });
  document.querySelectorAll('[data-action="resume-last"]').forEach(el => {
    el.onclick = () => {
      const last = loadLastMenu();
      if (last) {
        state.menu = last.menu || [];
        state.filters = { ...state.filters, ...(last.filters || {}) };
        state.menuStepMap = last.stepMap || {};
        state.menuParallel = last.parallel || {};
        state.view = 'editor'; render();
      }
    };
  });
  document.querySelectorAll('[data-set-day]').forEach(el => {
    el.onclick = () => {
      state.filters.dayType = el.dataset.setDay;
      if (state.filters.dayType === 'weekday') state.filters.space = '半面';
      else state.filters.space = '全面';
      state.filters.selectedSteps = defaultStepsFor(state.filters.dayType);
      state.filters.stepCounts = defaultStepCountsFor(state.filters.dayType, state.filters.selectedSteps);
      render();
    };
  });
  document.querySelectorAll('[data-toggle-step]').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.toggleStep;
      const arr = state.filters.selectedSteps;
      if (!state.filters.stepCounts) state.filters.stepCounts = {};
      const counts = state.filters.stepCounts;
      const i = arr.indexOf(k);
      // 統一アップ・ストレッチ・ゲーム形式アップは1個固定
      const isFixed = (k === 'warmup' || k === 'stretch' || k === 'gameWarmup');
      if (i < 0) {
        // 未選択 → 選択（カウント1）
        arr.push(k);
        counts[k] = 1;
      } else if (isFixed) {
        // 固定ステップは選択/解除のみ
        arr.splice(i, 1);
        delete counts[k];
      } else {
        // すでに選択中：×1→×2→×3→解除 と循環
        const c = counts[k] || 1;
        if (c < 3) {
          counts[k] = c + 1;
        } else {
          arr.splice(i, 1);
          delete counts[k];
        }
      }
      render();
    };
  });
  document.querySelectorAll('[data-set-space]').forEach(el => {
    el.onclick = () => { state.filters.space = el.dataset.setSpace; render(); };
  });
  document.querySelectorAll('[data-set-level]').forEach(el => {
    el.onclick = () => { state.filters.level = el.dataset.setLevel; render(); };
  });
  document.querySelectorAll('[data-toggle-sato-pref]').forEach(el => {
    el.onclick = () => { state.filters.preferSato = !state.filters.preferSato; render(); };
  });
  document.querySelectorAll('[data-toggle-manual-sato]').forEach(el => {
    el.onclick = () => { state.manual.preferSato = !state.manual.preferSato; render(); };
  });
  const peopleInput = document.getElementById('people-input');
  if (peopleInput) peopleInput.oninput = (e) => { const v = parseInt(e.target.value); if (!isNaN(v) && v > 0) state.filters.people = v; };

  document.querySelectorAll('[data-action="generate"]').forEach(el => {
    el.onclick = () => {
      if (state.filters.selectedSteps.length === 0) { showToast('ステップを1つ以上選んでください'); return; }
      const result = generateOrderedMenu(state.filters);
      state.menu = result.menu;
      state.menuStepMap = result.stepMap;
      state.menuParallel = result.parallel || {};
      state.view = 'editor';
      saveLastMenu({ menu: state.menu, filters: state.filters, stepMap: state.menuStepMap, parallel: state.menuParallel });
      render(); window.scrollTo(0, 0);
    };
  });
  document.querySelectorAll('[data-action="regenerate"]').forEach(el => {
    el.onclick = () => {
      const result = generateOrderedMenu(state.filters);
      state.menu = result.menu;
      state.menuStepMap = result.stepMap;
      state.menuParallel = result.parallel || {};
      saveLastMenu({ menu: state.menu, filters: state.filters, stepMap: state.menuStepMap, parallel: state.menuParallel });
      render(); showToast('再生成しました');
    };
  });

  document.querySelectorAll('[data-move-up]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const i = parseInt(el.dataset.moveUp);
      if (i > 0) {
        // 統一アップ（locked）の上には移動できない
        const above = getDrill(state.menu[i-1]);
        if (isLockedDrill(above)) return;
        [state.menu[i-1], state.menu[i]] = [state.menu[i], state.menu[i-1]];
        saveLastMenu({ menu: state.menu, filters: state.filters, stepMap: state.menuStepMap, parallel: state.menuParallel });
        render();
      }
    };
  });
  document.querySelectorAll('[data-move-down]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const i = parseInt(el.dataset.moveDown);
      if (i < state.menu.length - 1) {
        [state.menu[i], state.menu[i+1]] = [state.menu[i+1], state.menu[i]];
        saveLastMenu({ menu: state.menu, filters: state.filters, stepMap: state.menuStepMap, parallel: state.menuParallel });
        render();
      }
    };
  });
  document.querySelectorAll('[data-remove]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const i = parseInt(el.dataset.remove);
      const id = state.menu[i];
      state.menu.splice(i, 1);
      delete state.menuStepMap[id];
      delete state.menuParallel[id];
      saveLastMenu({ menu: state.menu, filters: state.filters, stepMap: state.menuStepMap, parallel: state.menuParallel });
      render();
    };
  });
  document.querySelectorAll('[data-show-alt]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); state.modal = { type: 'alt', idx: parseInt(el.dataset.showAlt), excluded: [] }; render(); };
  });
  document.querySelectorAll('[data-action="next-alt-batch"]').forEach(el => {
    el.onclick = () => {
      // 現在表示している候補のIDを除外リストに追加
      const m = state.modal;
      if (!m || m.type !== 'alt') return;
      const orig = getDrill(state.menu[m.idx]);
      if (!orig) return;
      const currentBatch = getAlternatives(orig.id, state.menu, state.filters, m.excluded || []);
      m.excluded = [...(m.excluded || []), ...currentBatch.map(a => a.id)];
      render();
    };
  });
  document.querySelectorAll('[data-action="reset-alt-excluded"]').forEach(el => {
    el.onclick = () => {
      if (state.modal && state.modal.type === 'alt') {
        state.modal.excluded = [];
        render();
      }
    };
  });
  document.querySelectorAll('[data-add-at]').forEach(el => {
    el.onclick = () => { state.modal = { type: 'add', insertAt: parseInt(el.dataset.addAt), query: '', genre: '' }; render(); };
  });
  document.querySelectorAll('[data-replace-with]').forEach(el => {
    el.onclick = () => {
      const newId = el.dataset.replaceWith;
      const idx = parseInt(el.dataset.replaceIdx);
      const oldId = state.menu[idx];
      const oldStep = state.menuStepMap[oldId];
      const hadParallel = state.menuParallel[oldId];
      state.menu[idx] = newId;
      delete state.menuStepMap[oldId];
      delete state.menuParallel[oldId];
      if (oldStep) state.menuStepMap[newId] = oldStep;
      // 新ドリルがスパイク&セッター不要なら並行を引き継ぐ
      const newDrill = getDrill(newId);
      if (newDrill && newDrill.genre === 'スパイク' && newDrill.needs_setter === false && hadParallel) {
        state.menuParallel[newId] = hadParallel;
      }
      state.modal = null;
      saveLastMenu({ menu: state.menu, filters: state.filters, stepMap: state.menuStepMap, parallel: state.menuParallel });
      render(); showToast('差し替え完了');
    };
  });
  document.querySelectorAll('[data-insert-id]').forEach(el => {
    el.onclick = () => {
      const newId = el.dataset.insertId;
      const at = state.modal.insertAt;
      state.menu.splice(at, 0, newId);
      // 手動追加分はstepMapに登録しない（編集画面で「追加」ヘッダー扱い）
      state.modal = null;
      saveLastMenu({ menu: state.menu, filters: state.filters, stepMap: state.menuStepMap, parallel: state.menuParallel });
      render(); showToast('追加しました');
    };
  });
  document.querySelectorAll('[data-add-to-menu]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.addToMenu;
      if (!state.menu.includes(id)) {
        state.menu.push(id);
        saveLastMenu({ menu: state.menu, filters: state.filters, stepMap: state.menuStepMap, parallel: state.menuParallel });
        showToast('メニューに追加'); render();
      }
    };
  });
  document.querySelectorAll('[data-toggle-fav]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.toggleFav;
      const i = state.favorites.indexOf(id);
      if (i >= 0) { state.favorites.splice(i, 1); showToast('お気に入りから外しました'); }
      else { state.favorites.push(id); showToast('お気に入りに追加'); }
      saveFavs(state.favorites);
      render();
    };
  });
  document.querySelectorAll('[data-remove-parallel]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const pid = el.dataset.removeParallel;
      delete state.menuParallel[pid];
      saveLastMenu({ menu: state.menu, filters: state.filters, stepMap: state.menuStepMap, parallel: state.menuParallel });
      render();
      showToast('並行を解除しました');
    };
  });
  document.querySelectorAll('[data-toggle-detail]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const k = el.dataset.toggleDetail;
      state.expandedId = (state.expandedId === k) ? null : k;
      render();
    };
  });
  document.querySelectorAll('[data-toggle-sato]').forEach(el => {
    el.onclick = () => { state.browse.sato = !state.browse.sato; render(); };
  });

  const bq = document.getElementById('browse-q');
  if (bq) bq.oninput = (e) => { state.browse.q = e.target.value; render(); setTimeout(() => { const x = document.getElementById('browse-q'); if(x) { x.focus(); x.setSelectionRange(x.value.length, x.value.length); } }, 0); };
  const bg = document.getElementById('browse-genre');
  if (bg) bg.onchange = (e) => { state.browse.genre = e.target.value; render(); };
  const bs = document.getElementById('browse-space');
  if (bs) bs.onchange = (e) => { state.browse.space = e.target.value; render(); };
  const bd = document.getElementById('browse-diff');
  if (bd) bd.onchange = (e) => { state.browse.diff = e.target.value; render(); };

  const aq = document.getElementById('add-q');
  if (aq && state.modal && state.modal.type === 'add') {
    aq.oninput = (e) => { state.modal.query = e.target.value; render(); setTimeout(() => { const x = document.getElementById('add-q'); if(x) { x.focus(); x.setSelectionRange(x.value.length, x.value.length); } }, 0); };
  }
  const ag = document.getElementById('add-genre');
  if (ag && state.modal && state.modal.type === 'add') ag.onchange = (e) => { state.modal.genre = e.target.value; render(); };

  document.querySelectorAll('[data-close-modal]').forEach(el => {
    el.onclick = (e) => {
      if (e.target.dataset.noClose) return;
      if (e.target !== el) return;
      state.modal = null;
      render();
    };
  });
  document.querySelectorAll('.modal').forEach(el => el.addEventListener('click', (e) => e.stopPropagation()));
  
  // ========== 履歴に保存 ==========
  document.querySelectorAll('[data-action="save-history"]').forEach(el => {
    el.onclick = () => {
      if (state.menu.length === 0) { showToast('メニューが空です'); return; }
      const now = new Date();
      const defaultName = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2,'0') + '-' +
        String(now.getDate()).padStart(2,'0') + ' 練習';
      const name = prompt('メニュー名を入力してください', defaultName);
      if (name === null) return;
      const entry = {
        id: 'hist-' + Date.now(),
        name: name || defaultName,
        saved_at: now.toISOString(),
        menu: state.menu.slice(),
        filters: { ...state.filters },
        stepMap: { ...state.menuStepMap },
        parallel: { ...state.menuParallel },
        review: { overall_note: '', drills: {} },
      };
      state.history.unshift(entry);
      saveHistory(state.history);
      showToast('履歴に保存しました');
      render();
    };
  });
  
  // 履歴詳細を表示
  document.querySelectorAll('[data-view-history]').forEach(el => {
    el.onclick = () => {
      state.viewingHistoryId = el.dataset.viewHistory;
      state.view = 'history-detail';
      render(); window.scrollTo(0, 0);
    };
  });
  
  // 履歴を再利用
  document.querySelectorAll('[data-action="reuse-history"]').forEach(el => {
    el.onclick = () => {
      const h = state.history.find(x => x.id === state.viewingHistoryId);
      if (!h) return;
      state.menu = h.menu.slice();
      state.menuStepMap = { ...(h.stepMap || {}) };
      state.menuParallel = { ...(h.parallel || {}) };
      state.filters = { ...state.filters, ...(h.filters || {}) };
      state.view = 'editor';
      saveLastMenu({ menu: state.menu, filters: state.filters, stepMap: state.menuStepMap, parallel: state.menuParallel });
      render(); window.scrollTo(0, 0);
      showToast('編集画面に展開しました');
    };
  });
  
  // 履歴を削除
  document.querySelectorAll('[data-action="delete-history"]').forEach(el => {
    el.onclick = () => {
      if (!confirm('この履歴を削除しますか？（戻せません）')) return;
      state.history = state.history.filter(x => x.id !== state.viewingHistoryId);
      saveHistory(state.history);
      state.viewingHistoryId = null;
      state.view = 'history';
      render();
      showToast('削除しました');
    };
  });
  
  // 振り返り入力（その場で state.history を更新、保存ボタンで永続化）
  document.querySelectorAll('[data-review-time]').forEach(el => {
    el.oninput = (e) => {
      const id = el.dataset.reviewTime;
      const h = state.history.find(x => x.id === state.viewingHistoryId);
      if (!h) return;
      if (!h.review) h.review = { overall_note: '', drills: {} };
      if (!h.review.drills) h.review.drills = {};
      if (!h.review.drills[id]) h.review.drills[id] = {};
      const v = parseInt(e.target.value);
      h.review.drills[id].actual_duration = isNaN(v) ? null : v;
    };
  });
  document.querySelectorAll('[data-review-note]').forEach(el => {
    el.oninput = (e) => {
      const id = el.dataset.reviewNote;
      const h = state.history.find(x => x.id === state.viewingHistoryId);
      if (!h) return;
      if (!h.review) h.review = { overall_note: '', drills: {} };
      if (!h.review.drills) h.review.drills = {};
      if (!h.review.drills[id]) h.review.drills[id] = {};
      h.review.drills[id].note = e.target.value;
    };
  });
  const overallNote = document.getElementById('hd-overall-note');
  if (overallNote) {
    overallNote.oninput = (e) => {
      const h = state.history.find(x => x.id === state.viewingHistoryId);
      if (!h) return;
      if (!h.review) h.review = { overall_note: '', drills: {} };
      h.review.overall_note = e.target.value;
    };
  }
  
  // 振り返りを保存
  document.querySelectorAll('[data-action="save-review"]').forEach(el => {
    el.onclick = () => {
      saveHistory(state.history);
      showToast('振り返りを保存しました');
      // 再描画して「振り返り済み」バッジを反映
      render();
    };
  });
  
  // ========== カスタムドリル ==========
  document.querySelectorAll('[data-action="new-custom"]').forEach(el => {
    el.onclick = () => {
      state.editingDrill = {
        genre: 'スパイク',
        category: '',
        difficulty: '★★★',
        space: '半面',
        min_people: 4,
        duration: 10,
      };
      state.view = 'custom-form';
      render(); window.scrollTo(0, 0);
    };
  });
  document.querySelectorAll('[data-edit-custom]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.editCustom;
      const d = state.customDrills.find(x => x.id === id);
      if (!d) return;
      state.editingDrill = { ...d };
      state.view = 'custom-form';
      render(); window.scrollTo(0, 0);
    };
  });
  document.querySelectorAll('[data-delete-custom]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.deleteCustom;
      if (!confirm('このオリジナルドリルを削除しますか？')) return;
      state.customDrills = state.customDrills.filter(x => x.id !== id);
      saveCustomDrills(state.customDrills);
      refreshAllDrills();
      cleanupStaleIds();
      state.favorites = loadFavs();
      state.editingDrill = null;
      state.view = 'browse';
      render();
      showToast('削除しました');
    };
  });
  document.querySelectorAll('[data-action="save-custom"]').forEach(el => {
    el.onclick = () => {
      const name = document.getElementById('cf-name')?.value?.trim();
      if (!name) { showToast('ドリル名を入力してください'); return; }
      const ed = state.editingDrill || {};
      const drill = {
        id: ed.id || ('custom-' + Date.now()),
        no: ed.no || Math.floor(Date.now() / 1000),
        name: name,
        genre: document.getElementById('cf-genre')?.value || 'スパイク',
        category: document.getElementById('cf-category')?.value?.trim() || '自作',
        purpose: document.getElementById('cf-purpose')?.value?.trim() || '',
        difficulty: document.getElementById('cf-difficulty')?.value || '★★★',
        min_people: parseInt(document.getElementById('cf-min-people')?.value) || 1,
        space: document.getElementById('cf-space')?.value || '半面',
        duration: parseInt(document.getElementById('cf-duration')?.value) || 10,
        equipment: document.getElementById('cf-equipment')?.value?.trim() || '',
        how_to: document.getElementById('cf-howto')?.value?.trim() || '',
        coaching_points: document.getElementById('cf-points')?.value?.trim() || '',
        variations: document.getElementById('cf-variations')?.value?.trim() || '',
        source: '自作',
        created_at: ed.created_at || new Date().toISOString(),
      };
      // ジャンルがスパイクなら needs_setter デフォルトはtrue（安全側）
      if (drill.genre === 'スパイク') drill.needs_setter = ed.needs_setter !== undefined ? ed.needs_setter : true;
      
      const idx = state.customDrills.findIndex(x => x.id === drill.id);
      if (idx >= 0) state.customDrills[idx] = drill;
      else state.customDrills.push(drill);
      saveCustomDrills(state.customDrills);
      refreshAllDrills();
      state.editingDrill = null;
      state.view = 'browse';
      render();
      showToast(idx >= 0 ? '更新しました' : '保存しました');
    };
  });
  
  // 自作のみフィルタ
  document.querySelectorAll('[data-toggle-custom-only]').forEach(el => {
    el.onclick = () => { state.browse.custom = !state.browse.custom; render(); };
  });
  
  // ========== エクスポート/インポート ==========
  document.querySelectorAll('[data-action="export-custom"]').forEach(el => {
    el.onclick = () => {
      if (state.customDrills.length === 0) { showToast('オリジナルドリルがありません'); return; }
      const ts = new Date().toISOString().slice(0,10);
      const ok = exportData(`practice-builder_custom_${ts}.json`, {
        type: 'practice-builder-custom',
        version: 1,
        exported_at: new Date().toISOString(),
        drills: state.customDrills,
      });
      showToast(ok ? `${state.customDrills.length}件をエクスポートしました` : 'エクスポート失敗');
    };
  });
  document.querySelectorAll('[data-action="import-custom"]').forEach(el => {
    el.onclick = () => {
      importData((data) => {
        if (!data || data.type !== 'practice-builder-custom' || !Array.isArray(data.drills)) {
          showToast('カスタムドリルのファイルではありません'); return;
        }
        const existingIds = new Set(state.customDrills.map(d => d.id));
        let added = 0;
        for (const d of data.drills) {
          if (!d.id) continue;
          if (existingIds.has(d.id)) continue;  // 重複はスキップ
          state.customDrills.push(d);
          added++;
        }
        saveCustomDrills(state.customDrills);
        refreshAllDrills();
        render();
        showToast(`${added}件取り込み（重複${data.drills.length - added}件をスキップ）`);
      });
    };
  });
  document.querySelectorAll('[data-action="export-history"]').forEach(el => {
    el.onclick = () => {
      if (state.history.length === 0) { showToast('履歴がありません'); return; }
      const ts = new Date().toISOString().slice(0,10);
      const ok = exportData(`practice-builder_history_${ts}.json`, {
        type: 'practice-builder-history',
        version: 1,
        exported_at: new Date().toISOString(),
        history: state.history,
      });
      showToast(ok ? `${state.history.length}件をエクスポートしました` : 'エクスポート失敗');
    };
  });
  document.querySelectorAll('[data-action="import-history"]').forEach(el => {
    el.onclick = () => {
      importData((data) => {
        if (!data || data.type !== 'practice-builder-history' || !Array.isArray(data.history)) {
          showToast('履歴のファイルではありません'); return;
        }
        const existingIds = new Set(state.history.map(h => h.id));
        let added = 0;
        for (const h of data.history) {
          if (!h.id) continue;
          if (existingIds.has(h.id)) continue;
          state.history.push(h);
          added++;
        }
        saveHistory(state.history);
        render();
        showToast(`${added}件取り込み（重複${data.history.length - added}件をスキップ）`);
      });
    };
  });
}

// ========== 起動 ==========
state.customDrills = loadCustomDrills();
state.history = loadHistory();
refreshAllDrills();
cleanupStaleIds();
state.favorites = loadFavs();
state.filters.selectedSteps = defaultStepsFor(state.filters.dayType);
state.filters.stepCounts = defaultStepCountsFor(state.filters.dayType, state.filters.selectedSteps);
render();
</script>
</body>
</html>
