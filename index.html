<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f4f0e8">
<title>練習メニュービルダー</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+JP:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap');

:root {
  --paper: #f4f0e8;
  --black: #1a1a1a;
  --pure-black: #000000;
  --red: #e63946;
  --blue: #1d4ed8;
  --yellow: #fbbf24;
  --line: #1a1a1a;
  --text-secondary: #6b6b6b;
  --text-tertiary: #999999;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

body {
  font-family: 'Space Grotesk', 'Noto Sans JP', sans-serif;
  background: var(--paper);
  color: var(--black);
  user-select: none; -webkit-user-select: none;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.4;
  position: relative;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

/* 背景の幾何学装飾 */
body::before {
  content: '';
  position: fixed;
  top: 4%; right: -22%;
  width: 42vw; height: 42vw;
  max-width: 380px; max-height: 380px;
  background: var(--red);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  opacity: 0.95;
}
body::after {
  content: '';
  position: fixed;
  bottom: -12%; left: -14%;
  width: 32vw; height: 32vw;
  max-width: 320px; max-height: 320px;
  background: var(--yellow);
  pointer-events: none;
  z-index: 0;
  transform: rotate(45deg);
}
.bg-triangle {
  position: fixed;
  top: 50%; left: -10%;
  width: 0; height: 0;
  border-left: 70px solid transparent;
  border-right: 70px solid transparent;
  border-bottom: 140px solid var(--blue);
  pointer-events: none;
  z-index: 0;
  transform: rotate(20deg);
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

.app {
  max-width: 980px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  z-index: 1;
  padding: 16px 16px 120px;
}

/* ===== ヘッダー ===== */
.app-header {
  background: var(--paper);
  border: 3px solid var(--black);
  box-shadow: 4px 4px 0 var(--black);
  padding: 14px 18px;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.brand {
  display: flex; flex-direction: column; line-height: 1;
}
.brand-mark {
  font-family: 'Archivo Black', sans-serif;
  font-size: 18px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.brand-jp {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--text-secondary);
  text-transform: uppercase;
  margin-top: 4px;
}

.tabs {
  display: flex;
  gap: 0;
  border: 3px solid var(--black);
}
.tab {
  padding: 8px 12px;
  border: none;
  border-right: 3px solid var(--black);
  background: var(--paper);
  font-family: 'Archivo Black', sans-serif;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.1s;
  color: var(--black);
}
.tab:last-child { border-right: none; }
.tab.active { background: var(--blue); color: var(--paper); }

/* ===== タイポグラフィ ===== */
h1 {
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(38px, 9vw, 60px);
  font-weight: 900;
  letter-spacing: -0.04em;
  text-transform: uppercase;
  line-height: 0.88;
  margin: 14px 0 22px;
}
h1 span.accent {
  color: var(--red);
  display: block;
  transform: rotate(-2deg) translateX(8px);
}
h2 {
  font-family: 'Archivo Black', sans-serif;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin-bottom: 14px;
  display: inline-block;
  background: var(--yellow);
  padding: 4px 10px;
}
.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--black);
  display: block;
  margin-bottom: 6px;
}

/* ===== カード ===== */
.card {
  background: var(--paper);
  border: 3px solid var(--black);
  padding: 18px;
  margin-bottom: 22px;
  position: relative;
  box-shadow: 4px 4px 0 var(--black);
}
.card-tight { padding: 14px; margin-bottom: 14px; }

/* ===== ボタン ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 22px;
  border: 3px solid var(--black);
  border-radius: 0;
  background: var(--paper);
  color: var(--black);
  font-family: 'Archivo Black', sans-serif;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.1s;
  box-shadow: 4px 4px 0 var(--black);
  white-space: nowrap;
}
.btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--black); }
.btn.primary { background: var(--blue); color: var(--paper); }
.btn.warn { background: var(--yellow); color: var(--black); }
.btn.danger { background: var(--red); color: var(--paper); }
.btn.large { padding: 16px 26px; font-size: 13px; width: 100%; letter-spacing: 0.12em; }
.btn.small {
  padding: 7px 12px; font-size: 10px;
  border-width: 2px;
  box-shadow: 3px 3px 0 var(--black);
  letter-spacing: 0.08em;
}
.btn.small:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--black); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

/* ===== 入力欄 ===== */
input[type="text"], input[type="number"], select {
  width: 100%;
  height: 46px;
  padding: 0 12px;
  border: 3px solid var(--black);
  border-radius: 0;
  background: var(--paper);
  color: var(--black);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px;
  font-weight: 500;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
input[type="number"] {
  width: 110px;
  font-family: 'Archivo Black', sans-serif;
  font-weight: 900;
}
input:focus, select:focus { background: var(--yellow); }

/* ===== チップ（選択肢ボタン） ===== */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 8px 14px;
  border: 2px solid var(--black);
  background: var(--paper);
  color: var(--black);
  font-family: 'Archivo Black', sans-serif;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.1s;
  box-shadow: 2px 2px 0 var(--black);
}
.chip:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--black); }
.chip.selected { background: var(--blue); color: var(--paper); }
.chip.selected.warn-color { background: var(--yellow); color: var(--black); }
.chip.selected.red-color { background: var(--red); color: var(--paper); }
.chip:disabled { opacity: 0.35; cursor: not-allowed; }
.chip .count {
  font-family: 'DM Mono', monospace; font-weight: 500;
  font-size: 10px; opacity: 0.7; margin-left: 4px;
}

/* ===== チェックボックス風 ===== */
.checkbox-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border: 2px solid var(--black);
  background: var(--paper); cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; font-weight: 700;
  box-shadow: 2px 2px 0 var(--black);
  transition: all 0.1s;
}
.checkbox-row:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--black); }
.checkbox-row.on { background: var(--yellow); }
.checkbox-row .check {
  width: 18px; height: 18px;
  border: 2.5px solid var(--black);
  background: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Archivo Black', sans-serif;
  font-size: 14px; line-height: 1;
}
.checkbox-row.on .check { background: var(--black); color: var(--paper); }

/* ===== ホーム ===== */
.hero {
  margin-bottom: 6px;
}
.hero-eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--black);
  margin-bottom: 8px;
}
.hero p {
  font-size: 14px;
  line-height: 1.6;
  max-width: 600px;
  margin-top: 0;
  margin-bottom: 24px;
}

.home-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.home-card {
  background: var(--paper);
  border: 3px solid var(--black);
  padding: 18px;
  text-align: left;
  box-shadow: 4px 4px 0 var(--black);
  transition: all 0.1s;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 130px;
  cursor: pointer;
}
.home-card:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--black); }
.home-card .icon {
  font-family: 'Archivo Black', sans-serif;
  font-size: 28px;
  line-height: 1;
  margin-bottom: 6px;
}
.home-card .title {
  font-family: 'Archivo Black', sans-serif;
  font-size: 14px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.home-card .desc {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 6px;
  line-height: 1.6;
}
.home-card.primary {
  grid-column: 1 / -1;
  background: var(--blue);
  color: var(--paper);
}
.home-card.primary .title { font-size: 16px; }
.home-card.primary .desc { color: rgba(244,240,232,0.85); }
.home-card.primary-alt {
  grid-column: 1 / -1;
  background: var(--yellow);
}

/* ===== 質問項目 ===== */
.q { margin-bottom: 18px; }
.q:last-child { margin-bottom: 0; }
.q-label {
  font-family: 'Archivo Black', sans-serif;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.q-num {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--red);
  letter-spacing: 0.08em;
}
.q-hint {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px; font-weight: 500;
  color: var(--text-secondary);
  margin-left: auto;
  text-transform: none; letter-spacing: 0;
}

/* ===== ステップヘッダー（順序固定モード） ===== */
.step-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0 4px;
  margin-top: 14px;
}
.step-header:first-child { margin-top: 0; }
.step-num {
  font-family: 'Archivo Black', sans-serif;
  font-size: 11px;
  background: var(--black);
  color: var(--paper);
  padding: 3px 7px;
  letter-spacing: 0.08em;
}
.step-name {
  font-family: 'Archivo Black', sans-serif;
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* ===== メニューサマリー ===== */
.summary-bar {
  display: flex; gap: 18px; flex-wrap: wrap;
  padding: 12px 16px;
  border: 3px solid var(--black);
  background: var(--paper);
  box-shadow: 3px 3px 0 var(--black);
  margin-bottom: 18px;
}
.summary-bar .item { display: flex; flex-direction: column; gap: 1px; }
.summary-bar .label {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-secondary);
  font-weight: 700;
}
.summary-bar .val {
  font-family: 'Archivo Black', sans-serif;
  font-size: 18px;
}
.summary-bar .val.warn { color: var(--red); }

/* ===== ドリルカード ===== */
.menu-list { display: flex; flex-direction: column; gap: 8px; }

.drill-card {
  background: var(--paper);
  border: 3px solid var(--black);
  padding: 12px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  box-shadow: 3px 3px 0 var(--black);
  position: relative;
}
.drill-card.locked { background: #f9f6ee; }
.drill-card.in-menu { background: #FEF3C7; border-color: var(--black); }

.drill-num {
  font-family: 'Archivo Black', sans-serif;
  font-size: 22px;
  line-height: 1;
  color: var(--text-secondary);
  min-width: 28px;
  padding-top: 2px;
}

.drill-body { flex: 1; min-width: 0; }
.drill-genre-row {
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  margin-bottom: 4px;
}
.genre-chip {
  font-family: 'Archivo Black', sans-serif;
  font-size: 10px;
  background: var(--blue);
  color: var(--paper);
  padding: 2px 7px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.cat-chip {
  font-family: 'DM Mono', monospace;
  font-size: 10px; font-weight: 500;
  background: transparent;
  color: var(--text-secondary);
  padding: 2px 0;
  letter-spacing: 0.04em;
}
.badge-sato {
  font-family: 'Archivo Black', sans-serif;
  font-size: 9px;
  background: var(--yellow);
  color: var(--black);
  padding: 2px 6px;
  border: 1.5px solid var(--black);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.badge-locked {
  font-family: 'DM Mono', monospace;
  font-size: 9px; font-weight: 700;
  color: var(--text-secondary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.drill-name {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--black);
  margin-bottom: 6px;
  line-height: 1.35;
  word-break: break-word;
  cursor: pointer;
}

.drill-meta {
  display: flex; flex-wrap: wrap; gap: 4px;
  font-size: 11px;
}
.meta-tag {
  padding: 2px 7px;
  border: 1.5px solid var(--black);
  background: var(--paper);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.04em;
}
.meta-tag.diff {
  background: var(--paper);
  color: var(--red);
  font-family: 'Archivo Black', sans-serif;
}
.meta-tag.time {
  background: var(--black);
  color: var(--paper);
  font-family: 'Archivo Black', sans-serif;
}

.drill-actions { display: flex; gap: 4px; flex-shrink: 0; flex-direction: column; }
.icon-btn {
  width: 32px; height: 32px;
  border: 2px solid var(--black);
  background: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Archivo Black', sans-serif;
  font-size: 14px;
  color: var(--black);
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--black);
  transition: all 0.1s;
}
.icon-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--black); }
.icon-btn.fav-on { background: var(--red); color: var(--paper); }
.icon-btn.danger:hover { background: var(--red); color: var(--paper); }
.icon-btn.in { background: var(--blue); color: var(--paper); }

/* ===== 追加スロット ===== */
.add-slot {
  border: 3px dashed var(--black);
  background: transparent;
  padding: 10px;
  font-family: 'Archivo Black', sans-serif;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  width: 100%;
  cursor: pointer;
  color: var(--black);
  transition: all 0.1s;
}
.add-slot:hover { background: var(--yellow); }

/* ===== 詳細展開 ===== */
.drill-detail {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 2px dashed var(--black);
  font-size: 13px;
  font-family: 'Noto Sans JP', sans-serif;
}
.drill-detail h4 {
  font-family: 'Archivo Black', sans-serif;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin: 10px 0 5px;
  background: var(--black);
  color: var(--paper);
  padding: 2px 6px;
  display: inline-block;
}
.drill-detail h4:first-child { margin-top: 0; }
.drill-detail p { white-space: pre-wrap; line-height: 1.65; color: var(--black); }

/* ===== モーダル ===== */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(26, 26, 26, 0.6);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.modal {
  background: var(--paper);
  border: 3px solid var(--black);
  box-shadow: 6px 6px 0 var(--black);
  padding: 22px;
  max-width: 700px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}
.modal-title {
  font-family: 'Archivo Black', sans-serif;
  font-size: 20px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  display: inline-block;
  background: var(--yellow);
  padding: 4px 10px;
}
.modal-sub {
  font-size: 13px;
  margin-top: 8px;
  color: var(--text-secondary);
}
.close-btn {
  width: 32px; height: 32px;
  border: 2px solid var(--black);
  background: var(--paper);
  font-family: 'Archivo Black', sans-serif;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--black);
}
.close-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--black); }

/* ===== 別案カード ===== */
.alt-grid { display: flex; flex-direction: column; gap: 10px; }
.alt-card {
  background: var(--paper);
  border: 3px solid var(--black);
  padding: 12px 14px;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--black);
  transition: all 0.1s;
}
.alt-card:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--black); }
.alt-card .alt-name {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px; font-weight: 700;
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.alt-card .alt-meta {
  display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px;
}
.alt-card .alt-purpose {
  font-size: 12px; color: var(--text-secondary);
  margin-bottom: 8px; line-height: 1.5;
}
.alt-card .alt-compare { display: flex; flex-wrap: wrap; gap: 4px; }
.compare-tag {
  padding: 2px 6px;
  border: 1.5px solid var(--black);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.compare-tag.same { background: var(--paper); }
.compare-tag.up { background: var(--red); color: var(--paper); }
.compare-tag.down { background: var(--yellow); color: var(--black); }

/* ===== ブラウズ画面 ===== */
.filter-bar {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 12px;
  border: 3px solid var(--black);
  background: var(--paper);
  box-shadow: 3px 3px 0 var(--black);
  margin-bottom: 14px;
}
.filter-bar input.search {
  flex: 1; min-width: 180px;
  height: 40px; padding: 0 10px;
  border: 2px solid var(--black);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
}
.filter-bar select {
  width: auto; height: 40px;
  padding: 0 10px;
  border: 2px solid var(--black);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 500;
}

/* ===== 戻るボタン ===== */
.back-btn {
  display: inline-flex;
  align-items: center; gap: 4px;
  font-family: 'Archivo Black', sans-serif;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 14px;
  color: var(--black);
  cursor: pointer;
  background: var(--paper);
  border: 2px solid var(--black);
  padding: 6px 10px;
  box-shadow: 2px 2px 0 var(--black);
}
.back-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--black); }

/* ===== 並行サブカード ===== */
.parallel-wrapper {
  position: relative;
  margin-left: 32px;
  margin-top: -2px;
}
.parallel-wrapper::before {
  content: '↳';
  position: absolute;
  left: -24px;
  top: 12px;
  font-family: 'Archivo Black', sans-serif;
  font-size: 18px;
  color: var(--blue);
}
.parallel-card {
  background: #FEF3C7;
  border: 2.5px solid var(--black);
  padding: 10px 12px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  box-shadow: 3px 3px 0 var(--black);
}
.parallel-card .pc-body { flex: 1; min-width: 0; }
.parallel-label {
  font-family: 'Archivo Black', sans-serif;
  font-size: 9px;
  background: var(--blue);
  color: var(--paper);
  padding: 2px 6px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  display: inline-block;
}
.parallel-name {

表的ゲームズアプローチ。楽しさと競争が両立"}, {"genre": "スパイク", "no": 1, "id": "スパイク-1", "name": "足つきネット前スパイク", "category": "打点・フォーム", "purpose": "一番高い位置でボールを捉える感覚", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール・ネット", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu072/p104", "how_to": "①2人1組、1人がネットから1.5mのところに立つ\n②パートナーにトスを上げてもらう\n③跳び上がらずに伸び上がって打つ\n④10回で交代（※左利きは反対）", "coaching_points": "・自分の一番高いところで打つ練習\n・脇を伸ばしてひじが上にいくような打ち方\n・ヒットの瞬間ひじが前に来ないようにする\n・ネットにひっかからないよう意識→自然と高い位置で捉えられる\n・ボールはアウトになってOK", "variations": "スパイクがネットにかかるときのフォーム修正メニューとしても使用", "target_players": "全員。特に打点が低い選手、長崎の高い打点の意識づけに", "needs_setter": false}, {"genre": "スパイク", "no": 2, "id": "スパイク-2", "name": "その場2ステップスパイク", "category": "タイミング", "purpose": "助走なしでジャンプタイミングをつかむ", "difficulty": "★", "min_people": 2, "equipment": "ボール・ネット", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu073/p105", "how_to": "①2人1組、1人がネットから1.5mに立つ\n②パートナーにトスを上げてもらう\n③その場でかかとから踏み込みスパイクを打つ\n④10回で交代", "coaching_points": "・助走がないのでタイミングを取ることに集中できる\n・自分でタイミングを計り、しっかり床を踏んで脇を伸ばし高いところで打つ\n・スロー踏み込みとの違い：こちらはタイミングをつかむドリル", "variations": "トスの高さを変える", "target_players": "タイミングが合わない選手に", "needs_setter": false}, {"genre": "スパイク", "no": 3, "id": "スパイク-3", "name": "その場ノーステップスパイク", "category": "タイミング", "purpose": "踏み込みなしでスイングとタイミング", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール・ネット", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu074/p106", "how_to": "①2人1組、1人がネットから1.5mに立つ\n②パートナーにトスを上げてもらう\n③踏み込みなしでジャンプしてスパイクを打つ\n④10回で交代", "coaching_points": "・ステップを踏まないので高さが出にくい→しっかりひざを曲げて真上にジャンプ\n・できるだけ高いところでスイングすることを意識\n・マーカーからボール1個分くらいの高さのトスでタイミングを合わせる", "variations": "ダイレクトスパイクのような不規則なボールにも対応できるようになる", "target_players": "全員", "needs_setter": false}, {"genre": "スパイク", "no": 4, "id": "スパイク-4", "name": "4.5mアプローチスパイク", "category": "助走", "purpose": "自分の歩幅と踏み込みの基本形を作る", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール・ネット", "space": "半面", "duration": 10, "source": "基本を極めるドリル", "page": "Menu075/p107", "how_to": "①2人1組、1人がネットから4.5mに立つ\n②パートナーにトスを上げてもらう\n③助走してスパイクを打つ\n④10回で交代", "coaching_points": "・アタックラインを左足で踏むことを基準に自分の踏み込み幅を覚える\n・空中には計るものがないのでアタックラインを基準にする\n・自分の1つの形を持つことが大事\n・助走スピードに負けないブレーキをかけてしっかり上に跳ぶ", "variations": "助走距離を3m→4.5m→6mと段階的に伸ばす", "target_players": "全員。特に自分のリズムが定まっていない選手", "needs_setter": false}, {"genre": "スパイク", "no": 5, "id": "スパイク-5", "name": "4.5mセルフスパイク", "category": "総合", "purpose": "自分でトスを上げて助走→スパイク（ハイボール対応）", "difficulty": "★★★★★", "min_people": 1, "equipment": "ボール・ネット", "space": "半面", "duration": 10, "source": "基本を極めるドリル", "page": "Menu076/p108", "how_to": "①ネットから4.5m離れたところに立つ\n②自分でトスを上げて助走してスパイクを打つ\n③10回繰り返す", "coaching_points": "・ボールを追いかけながらも真上に跳ぶ\n・自分の上げたトスに対して、ボールを捉えられる位置に入る\n・かかとから入ってブレーキをかけて真上に跳ぶことを確認\n・ハイボールのような後方からのトスに対応する練習にもなる", "variations": "ジャンプサーブの練習にも応用可", "target_players": "ある程度助走ができる選手向け", "needs_setter": false}, {"genre": "スパイク", "no": 6, "id": "スパイク-6", "name": "肩まわしスロー", "category": "スイング", "purpose": "自分の最高点を知る・大きな円弧の意識", "difficulty": "★★★", "min_people": 1, "equipment": "ボール1個", "space": "どこでも", "duration": 5, "source": "基本を極めるドリル", "page": "Menu077/p110", "how_to": "①ボールを片手に持って前後に足を広げて立つ\n②ボールを持った側の肩を開く\n③大きく腕を2回まわす\n④高い位置から投げる\n⑤5回繰り返す", "coaching_points": "・自分の手を最大限に伸ばした状態でグルグルまわす\n・自分の最高点を理解する\n・自分が描く円弧を知る\n・実際にはこういう打ち方はしないが、打点を高くするためにはこの練習を欠かさない", "variations": "なし", "target_players": "全員。打点が低い選手に特に有効", "needs_setter": false}, {"genre": "スパイク", "no": 7, "id": "スパイク-7", "name": "叩きつけ", "category": "スイング", "purpose": "スナップのスピードを上げる", "difficulty": "★★★", "min_people": 1, "equipment": "ボール1個", "space": "どこでも", "duration": 5, "source": "基本を極めるドリル", "page": "Menu078/p110", "how_to": "①ボールを片手で持って足を前後に広げて立つ\n②利き腕のひじを上げて構える\n③低い位置でトスを上げ、ボールを全力で床に打ちつける\n④10回繰り返す", "coaching_points": "・スナップのスピードを上げるための練習\n・高いところではなく、あえて低いところで打ちスイングの速さを身につける\n・ボールを力強く叩く目的", "variations": "なし", "target_players": "スイングスピードが遅い選手に", "needs_setter": false}, {"genre": "スパイク", "no": 8, "id": "スパイク-8", "name": "足つきボールコントロール", "category": "コントロール", "purpose": "手首を使ってねらったところに打ち分ける", "difficulty": "★★★★", "min_people": 3, "equipment": "ボール複数", "space": "半面", "duration": 10, "source": "基本を極めるドリル", "page": "Menu079/p111", "how_to": "①3人1組、スパイカーの斜め前4.5mにパートナー\n②パートナーが山なりのボールを投げる\n③スパイカーは打ちたい方向（球拾いの位置）に打つ\n④10回で交代", "coaching_points": "・手首を使ってボールをコントロール\n・打った後にあえて人差し指を指すようにすると手首が自然と折り曲がる\n・ねらうのはパートナーのひざとひざの間\n・ボールに回転をかけるとコントロールが向上\n・身長が低い選手ほど身につけてほしい技術（ブロックアウト等の武器になる）", "variations": "なし", "target_players": "全員。特に白岩（スパイク開発中）", "needs_setter": false}, {"genre": "スパイク", "no": 9, "id": "スパイク-9", "name": "エアマット狙い打ち", "category": "コントロール", "purpose": "ネット上でA/B/C/Dエリアに打ち分け", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール・エアマット", "space": "全面", "duration": 10, "source": "基本を極めるドリル", "page": "Menu080/p112", "how_to": "①相手コートにエアマットを立てかける\n②スパイカーは自コートのネット前1.5mに立つ\n③パートナーが投げた山なりのボールを跳ばずにA/B/C/Dの4エリアに打ち分け\n④10回で交代", "coaching_points": "・実際にネットの上でどこをねらうかという練習\n・まず足をついた状態で脇を伸ばして打てるかチェック\n・次にネット上でコントロールできるかチェック\n・段階を踏んで確認する\n・最初はフルスイングしなくてもよい→大事なのはコントロール\n・簡単なようでなかなかできない→必須メニュー", "variations": "実際のトスでの打ち分けに移行", "target_players": "全員。特にコース打ちが苦手な選手", "needs_setter": false}, {"genre": "スパイク", "no": 10, "id": "スパイク-10", "name": "直上レシーブ＆ミートスパイク", "category": "総合", "purpose": "レシーブ→スパイクの連続・ボールコントロール確認", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール・ネット", "space": "全面", "duration": 10, "source": "基本を極めるドリル", "page": "Menu081/p113", "how_to": "①2人1組、ネットを挟んで4.5mで向き合う\n②ミートをかけてパートナーにスパイクを打つ\n③パートナーは直上レシーブ→スパイクで打ち返す\n④繰り返す", "coaching_points": "・正しい位置でボールを捉え、ボールコントロールできるかの確認\n・これまでの練習の総合チェック", "variations": "STEPUP①：直上レシーブをあえて少しずらしても打てるように\nSTEPUP②：距離を4.5m→6mに伸ばす", "target_players": "全員", "needs_setter": false}, {"genre": "スパイク", "no": 11, "id": "スパイク-11", "name": "フェイントミート", "category": "フェイント", "purpose": "スパイクに見せかけて柔らかく落とす", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール・ネット", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu082/p118", "how_to": "①ゲーム形式で実施\n②スパイクに見せかけてフェイントで柔らかく落とす\n③相手セッターや相手エースにとらせることを狙う", "coaching_points": "・フェイントは5つの手段がある（打ち方/アプローチ/踏み込みずらし/コース変化/タイミング変化）\n・効果的なタイミング：自分のスパイクが決まっているとき、エクセレントセッティングのとき\n・相手コートの穴を見つけて落とす", "variations": "ゲーム中に積極的に使わせる", "target_players": "全員。特に攻撃のバリエーションが少ない選手", "needs_setter": true}, {"genre": "スパイク", "no": 12, "id": "スパイク-12", "name": "リバウンド＆タッチアウト", "category": "ブロックアウト", "purpose": "ブロックに当てて得点する技術", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール・ネット", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu083/p119", "how_to": "①2人1組、ネットを挟む\n②コーチまたはパートナーがブロック面を出す\n③スパイカーがブロックの手に当てて得点を狙う\n④10回で交代", "coaching_points": "・ブロッカーの手に意図的にボールを当ててアウトにする技術\n・手首のスナップを使う\n・ブロッカーの外側の手を狙う", "variations": "ブロッカーの位置を変える", "target_players": "赤坂・長崎（エースアタッカー）", "needs_setter": false}, {"genre": "スパイク", "no": 13, "id": "スパイク-13", "name": "ストレートアプローチ", "category": "フットワーク", "purpose": "ネットにまっすぐ入る基本アプローチ", "difficulty": "★★★★", "min_people": 1, "equipment": "なし", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu107/p154", "how_to": "①ネットにまっすぐ向かって助走\n②正しいフットワークで踏み切り→ジャンプ\n③ボールなしで5回繰り返す", "coaching_points": "・最も基本的な助走パターン\n・かかとからブレーキをかけて真上にジャンプ\n・助走スピードを落とさず踏み切る", "variations": "ボールを加えて実施", "target_players": "全員。助走の基本確認", "needs_setter": false}, {"genre": "スパイク", "no": 14, "id": "スパイク-14", "name": "アングルアプローチ", "category": "フットワーク", "purpose": "斜めに入るアプローチ", "difficulty": "★★★★", "min_people": 1, "equipment": "なし", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu108/p154", "how_to": "①ネットに対して斜めに入る助走\n②フットワーク→踏み切り→ジャンプ\n③5回繰り返す", "coaching_points": "・斜めに入ることでセットを見やすい状況を作る\n・短いセットに対応しやすい", "variations": "ボールを加えて実施", "target_players": "全員", "needs_setter": false}, {"genre": "スパイク", "no": 15, "id": "スパイク-15", "name": "ループアプローチ", "category": "フットワーク", "purpose": "回り込んで入るアプローチ", "difficulty": "★★★★", "min_people": 1, "equipment": "なし", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu109/p155", "how_to": "①回り込んで入る助走\n②フットワーク→踏み切り→ジャンプ\n③5回繰り返す", "coaching_poin ariations": "距離をさらに伸ばす / 4人で四角形に", "target_players": "全員。特にロングトスが届かない選手"}, {"genre": "セット", "no": 27, "id": "セット-27", "name": "ジャンプトス", "category": "セッター技術", "purpose": "ジャンプしてのトスアップ", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール複数", "space": "半面", "duration": 10, "source": "練習メニュー200", "page": "Menu157/p199", "how_to": "①2人以上、セッターとボール出し\n②ボール出しからのボールをジャンプしてセット\n③一定時間で交代", "coaching_points": "・ジャンプセットで攻撃の速度が上がる\n・セッター自身もツーアタックの脅威になれる\n・空中でのボールコントロール（上半身の筋力が必要）\n・着地は両足でバランスよく→正しい空中姿勢の証拠", "variations": "ジャンプセット→ツーアタックの選択を加える", "target_players": "セッター候補。赤坂のジャンプセット向上にも"}, {"genre": "セット", "no": 28, "id": "セット-28", "name": "ワンハンドトス＆ツーアタック", "category": "セッター技術", "purpose": "ワンハンドでのトス＋ツーアタック", "difficulty": "★★★★★", "min_people": 2, "equipment": "ボール複数", "space": "半面", "duration": 10, "source": "練習メニュー200", "page": "Menu158/p200", "how_to": "①2人以上\n②ネット際のボールをワンハンドで処理\n③ツーアタック（セッターの攻撃）を混ぜる\n④一定時間で交代", "coaching_points": "・ネット際のボールが越えそうな時のワンハンド処理\n・セッターも攻撃者であるメンタリティーを持つ\n・ワンハンドはティップと同じ手の形で、ボールをキープ", "variations": "なし", "target_players": "セッター候補。上級者向け"}, {"genre": "セット", "no": 29, "id": "セット-29", "name": "長いトスの左右ブレを直す", "category": "セッター矯正", "purpose": "ゴムひもを目安にトス軌道を修正", "difficulty": "★★★★", "min_people": 3, "equipment": "ボール・ゴムひも", "space": "全面", "duration": 10, "source": "練習メニュー200", "page": "Menu159/p201", "how_to": "①3人以上\n②ネットより50〜80cm上にゴムひもを張る\n③セッターがゴムひもを軌道の目安にしてトスを上げる\n④両サイドに台を置き、トスの目安にする", "coaching_points": "・ゴムひもがトス軌道の視覚的ガイドになる\n・長いトスほど体の向きとボールを送り出す方向を明確にする\n・ボールを捉える位置も重要→自分にとってコントロールしやすいポイントを見つける", "variations": "ゴムひもの高さを変える / 左右のトスを交互に", "target_players": "トスが左右にブレるセッター"}, {"genre": "セット", "no": 30, "id": "セット-30", "name": "両サイドまでの距離感をつかむ", "category": "セッター技術", "purpose": "アンテナ＋台を目安に両サイドへのトス", "difficulty": "★★★★", "min_people": 4, "equipment": "ボール・アンテナ・台", "space": "全面", "duration": 10, "source": "練習メニュー200", "page": "Menu160/p202", "how_to": "①4人以上\n②両サイドにアンテナを50〜80cm間隔で2本ずつ設置\n③台上に1人ずつ配置（トスの目安）\n④セッターが前衛ライトから入り、2本のアンテナの間をねらってトス\n⑤一定時間で交代", "coaching_points": "・アンテナ間が的になり、トスの正確性を視覚化\n・台上の人がアタッカーの打点をイメージさせる\n・ネットに近すぎたり離れすぎたりしない安定感が最重要", "variations": "トスの種類を変える（オープン/平行/クイック）", "target_players": "セッター候補"}, {"genre": "セット", "no": 31, "id": "セット-31", "name": "コーンを回ってトスを上げる", "category": "セッター移動", "purpose": "移動→定位置→トスの流れ", "difficulty": "★★★★", "min_people": 3, "equipment": "ボール・コーン/マーカー", "space": "半面", "duration": 10, "source": "練習メニュー200", "page": "Menu161/p203", "how_to": "①3人以上\n②コーン/マーカーを配置\n③セッターがコーンを回ってから定位置に入りトス\n④さまざまな方向からの移動→トス\n⑤一定時間で交代", "coaching_points": "・移動→定位置→トスの流れ\n・セッターは「どこからでも、どんな方向へも」セットできる必要がある\n・移動後にしっかり止まってからトスを上げる", "variations": "コーンの配置を変える / 移動距離を変える", "target_players": "セッター候補"}, {"genre": "セット", "no": 32, "id": "セット-32", "name": "レシーブからのトスアップ", "category": "セッター連携", "purpose": "レシーブ→セッターへ→トスの流れ", "difficulty": "★★★★", "min_people": 4, "equipment": "ボール複数", "space": "全面", "duration": 10, "source": "練習メニュー200", "page": "Menu162/p204", "how_to": "①4人以上\n②レシーバーがレシーブ→セッターへ返球→セッターがトス\n③一連の流れを繰り返す\n④一定時間で交代", "coaching_points": "・Aパス/Bパス/Cパスに応じたセッターの対応\n・パスが乱れた時ほど「足で上げる」ことが重要\n・セッターの移動スピードと定位置への入り方", "variations": "パスの質を意図的に変える（A→B→C）", "target_players": "全員。セッターとレシーバーの連携"}, {"genre": "セット", "no": 33, "id": "セット-33", "name": "前後左右のレシーブ（リベロ用）", "category": "リベロ技術", "purpose": "リベロ専用の前後左右レシーブドリル", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール複数", "space": "半面", "duration": 10, "source": "練習メニュー200", "page": "Menu163/p205", "how_to": "①2人以上\n②コーチが前後左右にボールを出す\n③リベロ専用の全方向レシーブドリル\n④一定時間で交代", "coaching_points": "・リベロは守備のリーダー\n・全方向への反応速度と正確な返球\n・オーバーハンドとアンダーハンドの使い分け", "variations": "ボールの速度/方向をランダムに", "target_players": "池田（リベロ型）に最適"}, {"genre": "セット", "no": 34, "id": "セット-34", "name": "リベロと2人でレシーブ", "category": "リベロ連携", "purpose": "リベロ＋セッターの2人連携", "difficulty": "★★★★", "min_people": 3, "equipment": "ボール複数", "space": "半面", "duration": 10, "source": "練習メニュー200", "page": "Menu164/p206", "how_to": "①3人以上（リベロ＋パートナー＋ボール出し）\n②リベロとパートナーが2人で連携してレシーブ\n③声出し・カバーリングを意識\n④一定時間で交代", "coaching_points": "・リベロとセッターの2人連携\n・リベロがアタックライン前でセットする場面も想定\n・リベロのアンダーハンドセット技術も鍛える", "variations": "パートナーをセッター候補に固定", "target_players": "池田＋赤坂 or 池田＋他選手の連携に"}, {"genre": "セット", "no": 35, "id": "セット-35", "name": "ステーショナリー練習（ゾーン4向け）", "category": "セッター基礎", "purpose": "定位置からゾーン4へ反復セット（台上キャッチ）", "difficulty": "★★★", "min_people": 3, "equipment": "ボール複数・台", "space": "全面", "duration": 15, "source": "JVAコーチング基礎編", "page": "p148-149", "how_to": "①セッターを定位置に固定\n②ボール出しからセッターへパス\n③セッターがゾーン4に向けて反復セット\n④台上のキャッチ役がキャッチ（打点をイメージ）\n⑤1回のセッティングごとに基本の立ち位置を確認", "coaching_points": "・まずは数多くボールに触ること\n・エースポジション（ゾーン4）に確実に上げる練習\n・台の位置はアタッカーの腕の振り幅分だけネットから離す\n・立ち位置を毎回確認する習慣→自然と感覚が身につく", "variations": "ゾーン3/2/8にも展開", "target_players": "セッター候補。基本中の基本"}, {"genre": "セット", "no": 36, "id": "セット-36", "name": "セッターを動かす練習", "category": "セッター移動", "purpose": "落下点まで移動→各ゾーンへセット", "difficulty": "★★★★", "min_people": 3, "equipment": "ボール複数", "space": "全面", "duration": 15, "source": "JVAコーチング基礎編", "page": "p149", "how_to": "①3人以上\n②ボール出しがさまざまな位置にボールを出す\n③セッターが落下点まで移動→各ゾーンへセット\n④Bパス以下の状況でも安定したセットを目指す", "coaching_points": "・Bパス以下でもセッターの技術力が問われる\n・「どこからでも、どんな方向へも」セットできることが目標\n・コート右半分→Face to 4、左半分→Back on 2", "variations": "パスの質を意図的に変える / 移動距離を変える", "target_players": "セッター候補"}, {"genre": "セット", "no": 37, "id": "セット-37", "name": "逆方向セット（ゴー・アゲインスト・ザ・フロー）", "category": "セッター戦術", "purpose": "ボールの流れと逆方向にセット（ブロック1枚化）", "difficulty": "★★★★★", "min_people": 3, "equipment": "ボール複数", "space": "全面", "duration": 15, "source": "JVAコーチング基礎編", "page": "p150", "how_to": "①3人以上\n②ボール出しがセッターの左右どちらかに流れるボールを出す\n③セッターはボールの流れと逆方向にセット\n④ゾーン4に流れたらゾーン2へ、逆も同様", "coaching_points": "・リスクはあるがBパス以下でもブロック1枚化の可能性\n・かなりの脚力を要する技術\n・コート右半分→Face to 4、左半分→Back on 2が基本\n・十分なセット位置までの移動が鍵（ドリブル防止）", "variations": "移動距離を段階的に伸ばす", "target_players": "セッター候補。上級技術"}, {"genre": "セット", "no": 38, "id": "セット-38", "name": "ゾーン別セッティング組み合わせ", "category": "セッター総合", "purpose": "定位置→各ゾーン移動→各方向セット（12パターン）", "difficulty": "★★★★★", "min_people": 3, "equipment": "ボール複数", "space": "全面", "duration": 20, "source": "JVAコーチング基礎編", "page": "p150-151", "how_to": "①3人以上\n②12パターンの組み合わせで実施：\n  (1)定位置→ゾーン4/3/2/8（オープン＆クイック）\n  (2)ゾーン4移動→各方向\n  (3)ゾーン2移動→各方向\n  (4)ゾーン8/9/7移動→各方向\n③各パターンを反復", "coaching_points": "・変化に富んだ内容で選手も得意/苦手を発見できる\n・パターンを分けることでテーマを絞り込める\n・セッター専門練習の集大成", "variations": "オープンセットとクイックセットを交互に", "target_players": "セッター候補。時間をかけてじっくり"}, {"genre": "セット", "no": 39, "id": "セット-39", "name": "ロングパス練習", "category": "セッター筋力", "purpose": "長い距離のパスで足を使ったセット力を鍛える", "difficulty": "★★★", "min_people": 2, "equipment": "ボール1個", "space": "全面", "duration": 10, "source": "JVAコーチング基礎編", "page": "p151", "how_to": "①2人以上、コート全面を使って長い距離のOHパス\n②全身、特に足を重点的に使ってトスを上げる\n③一定時間で交代", "coaching_points": "・セットに必要な筋力をウエイトによらず技術練習の中で鍛える\n・地味だが必要不可欠\n・足で上げる感覚を全身で覚える\n・JVA基礎編が「是非取り入れたい練習」と推奨", "variations": "距離をさらに伸ばす / 3人三角ロングパスに発展", "target_players": "全員。「セッター練習」ではなく「パス筋力トレ」として全員で実施可"}, {"genre": "セット", "no": 40, "id": "セット-40", "name": "後衛3人＋セッター（セッター視点）", "category": "セッター判断", "purpose": "後衛3人のディグを受け、ダンプorセットを判断。ミス時はコーチ追加球で成功体験", "difficulty": "★★★★★", "min_people": 5, "equipment": "ボール複数", "space": "全面", "duration": 10, "source": "Reynaud", "page": "Ch8/Session4", "how_to": "①4人1組（後衛3人＋セッター）\n②ネット越しにサーブ→後衛がディグ→セッターへ\n③セッターがダンプ（ツー攻撃）orセット→後衛がバックアタック\n④ミス時はコーチが追加球→成功体験を積ませる", "coaching_points": "・セッターのダンプ判断力を鍛える（攻撃者のメンタリティー）\n・コーチの追加球で成功体験→自信につながる\n・サーブ/パス/セット/アタック/リーディングの総合練習", "variations": "ダンプなしバージョン（最初は2段トスのみ）", "target_players": "セッター候補。池田にとって良い経験の場"}, {"genre": "ブロック", "no": 1, "id": "ブロック-1", "name": "スクワットポジションからの構え作り", "category": "構え基礎", "purpose": "シャフトを使った正しいブロック構えの作り方", "difficulty": "★★", "min_people": 1, "equipment": "シャフト", "space": "どこでも", "duration": 5, "source": "基本を極めるドリル", "page": "p123", "how_to": "①シャフトを自分の前に置く\n②スクワットポジションから両手でシャフトを持つ\n③シャフトをひざの前まで持ち上げたら、誰かに受け取ってもらう\n④そのまま両手を上げるとブロックの構え", "coaching_points": "・身体を起こすことで床から力をもらうことができる\n・正しいジャンプにつながる基本の構え\n・背筋を起こした状態を保つ", "variations": "シャフトなしでフォーム確認", "target_players": "全員。ブロックの全ドリルの前提"}, {"genre": "ブロック", "no": 2, "id": "ブロック-2", "name": "その場ブロックジャンプ", "category": "ジャンプ基礎", "purpose": "まっすぐ跳んでまっすぐ降りる（着地位置の確認）", "difficulty": "★★★", "min_people": 1, "equipment": "ネット", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu085/p124", "how_to": "①ネット前にブロックの構えで立つ\n②そこからブロックジャンプする\n③元の位置に着地する\n④10回繰り返す", "coaching_points": "・まっすぐ跳んでまっすぐ降りることが第一\n・ここができないと次のステップに進めない\n・着地が前後左右に乱れる人は空中で身体がゆるんでいる\n・タッチネットにもつながるので注意\n・つねに跳んだ位置に戻ることを意識", "variations": "なし", "target_players": "全員。毎日の基本確認"}, {"genre": "ブロック", "no": 3, "id": "ブロック-3", "name": "サイドステップブロックジャンプ", "category": "ステップ", "purpose": "左右移動後も同じ構えでジャンプ（フットワーク重視）", "difficulty": "★★★★★", "min_people": 1, "equipment": "ネット", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu086/p125", "how_to": "①ネット前にブロックの構えで立つ\n②ブロックジャンプ→着地→サイドステップで横に移動\n③構え→ブロックジャンプ\n④左右交互に各10回", "coaching_points": "・横に移動してもきちんとブレーキをかけて真上に跳ぶ\n・左右両方できないとダメ\n・まずフットワークが正確にできること→スピードは徐々に\n・進行方向の足に重心が乗って斜めに跳ぶのはNG", "variations": "移動距離を変える / テンポを上げる", "target_players": "全員"}, {"genre": "ブロック", "no": 4, "id": "ブロック-4", "name": "クロスステップブロックジャンプ", "category": "ステップ", "purpose": "クロスステップ→構え→ジャンプ（長い移動対応）", "difficulty": "★★★★★", "min_people": 1, "equipment": "ネット", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu087/p126", "how_to": "①ネット前にブロックの構えで立つ\n②ブロックジャンプ→着地→クロスステップで横に移動\n③構え→ブロックジャンプ\n④左右交互に各10回", "coaching_points": "・1歩目をクロスに出して移動\n・サイドステップより距離が稼げる\n・クロスステップだと後ろの足が先にクロスに出る→隣の人がついて行きやすい（2枚ブロックに有利）\n・重心が身体の外に行かない基本はサイドステップと同じ", "variations": "3ステップクロスオーバーに発展", "target_players": "全員。特に2枚ブロックの基礎として"}, {"genre": "ブロック", "no": 5, "id": "ブロック-5", "name": "前後移動ジャンプ", "category": "ステップ", "purpose": "ネットから離れた→前進→ブロックジャンプ（タッチネット防止）", "difficulty": "★★★★★", "min_people": 1, "equipment": "ネット", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu088/p127", "how_to": "①ネットから1.5m離れてブロックの構えで立つ\n②ネットに向かって走っていく\n③ブレーキをかけてブロックジャンプ\n④10回繰り返す", "coaching_points": "・ディフェンスで下がった後にすぐ前に出てブロックする状況を想定\n・前後の動きでもタッチネットしないようブレーキをかける\n・床からしっかり力をもらって真上にジャンプの原則を点検できる", "variations": "なし", "target_players": "全員。前に流れてタッチネットする選手に"}, {"genre": "ブロック", "no": 6, "id": "ブロック-6", "name": "肩甲骨ブロック", "category": "手の出し方", "purpose": "肩甲骨を持ち上げて高さを出す形作り", "difficulty": "★★★", "min_people": 1, "equipment": "なし", "space": "どこでも", "duration": 5, "source": "基本を極めるドリル", "page": "Menu089/p128", "how_to": "①ブロックの姿勢で構える\n②肩甲骨を上に持ち上げながらブロックの形を作る\n③この動作を繰り返す\n④10回", "coaching_points": "・ブロックは手ではなく、腕と連動している肩甲骨を前にしっかり出す\n・肩甲骨を持ち上げることで普通に腕を上げるより5cm以上高くなる\n・後ろの筋肉（背中）で身体を動かす意識\n・胸を開いたり手を上げ下ろしする際に肩甲骨の動きを自分で確認", "variations": "なし", "target_players": "全員。特に長崎（173cm→肩甲骨挙上でさらに到達点UP）"}, {"genre": "ブロック", "no": 7, "id": "ブロック-7", "name": "アンブレラ", "category": "手の出し方", "purpose": "傘を使って吸い込み防止（ネットと腕の隙間をなくす）", "difficulty": "★★★★", "min_people": 2, "equipment": "傘・ネット", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu090/p129", "how_to": "①2人1組、ネットを挟んでブロッカーとパートナー\n②パートナーが傘をネットの上に差す\n③ブロッカーは傘の曲面に腕を沿わせるようにブロックジャンプ→着地\n④10回で交代", "coaching_points": "・あおりブロック防止→ネットと手のひら・腕の間隔を狭くする\n・吸い込みをなくす→ボールをそこに入れないイメージ\n・掌底からスーッと前腕の内側をこすりつけて出す\n・降りるときも間をあけず傘の曲面に沿って降りる\n・傘の先端を保護すること（テーピング等で）→安全最優先", "variations": "上級者：傘なしで掌底を突き出す練習（白帯から離れない）", "target_players": "全員。吸い込みが多い選手に特に"}, {"genre": "ブロック", "no": 8, "id": "ブロック-8", "name": "真後ろワンタッチ", "category": "手の出し方", "purpose": "掌底で面を作り、ボールを意図的に後ろへ運ぶ", "difficulty": "★★★★★", "min_people": 2, "equipment": "ボール・ネット・台", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu091/p130", "how_to": "①2人1組、ネットを挟む\n②台上のコーチがスパイクを打つ\n③ブロッカーは掌底を前に出しブロック\n④ボールを意図的に後ろに飛ばす（ソフトブロック）\n⑤10回で交代", "coaching_points": "・両手を1つの面として捉え、しっかり面を作る\n・意図的にボールを真後ろに運ぶ\n・ソフトブロックの技術→ワンタッチを取ってディグにつなげる\n・手首が折れないようにする", "variations": "なし", "target_players": "全員。ソフトブロックの習得"}, {"genre": "ブロック", "no": 9, "id": "ブロック-9", "name": "ネット越しキャッチ", "category": "手の出し方", "purpose": "相手コートでボールをキャッチ（手首を返す・タッチネット防止）", "difficulty": "★★★★★", "min_people": 2, "equipment": "ボール・ネット", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu092/p130", "how_to": "①2人1組、ネットを挟む\n②コーチが投げたボールを相手コートでキャッチして着地\n③タッチネットしないで元の位置に手が戻る\n④10回で交代", "coaching_points": "・相手コートまで手を出してボールをつかんでくる\n・ボールをつかむ動作=手首を返すこと→実際にはブロックで叩くのと同じ\n・つかんだ後もネットに触らないで戻る練習にもなる\n・キルブロックの手の感覚を養う", "variations": "投げる位置・高さを変える", "target_players": "全員。キルブロックの手の使い方"}, {"genre": "ブロック", "no": 10, "id": "ブロック-10", "name": "落ち際ブロック", "category": "タイミング", "purpose": "早めに跳んで最後まで手を残す", "difficulty": "★★★★★", "min_people": 2, "equipment": "ボール・ネット・台", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu093/p131", "how_to": "①2人1組、ネットを挟む\n②台上のコーチがスパイクを打つ\n③ブロッカーはわざと早めに跳ぶ\n④落ちる直前まで手をネット上に残してブロック\n⑤10回で交代", "coaching_points": "・最後まで両手を残す→ブロック滞空時間の最大化\n・タイミングが少し早くても手を残すことでブロックチャンスを逃さない\n・空中での体幹の安定が必須（腹筋を締める）", "variations": "なし", "target_players": "全員。特にタイミングが早い選手の補正に"}, {"genre": "ブロック", "no": 11, "id": "ブロック-11", "name": "ブロック姿勢キープ", "category": "体幹", "purpose": "腕立て姿勢で腹筋に力を入れて20秒キープ", "difficulty": "★★", "min_people": 1, "equipment": "なし", "space": "どこでも", "duration": 5, "source": "練習メニュー200", "page": "Menu137/p180", "how_to": "①両腕を伸ばし、腕立て伏せの姿勢になる\n②腹筋に力を入れてそのまま20秒キープ\n③上記を1セットとし、2セット行う", "coaching_points": "・ジャンプした時に体が伸びていると強いスパイクに力負け\n・腹筋と大腿筋に力が入っているかチェック\n・視線は手と手の間を見る→空中でボールを見るイメージ\n・体が「くの字」になっていればOK", "variations": "キープ時間を30秒→40秒に伸ばす", "target_players": "全員。金曜のフィジカルトレーニングにも"}, {"genre": "ブロック", "no": 12, "id": "ブロック-12", "name": "2人組のつま先タッチ", "category": "ジャンプ", "purpose": "ネット越しにつま先を相手の手に当てる（くの字意識）", "difficulty": "★★★", "min_people": 2, "equipment": "ネット", "space": "半面", "duration": 5, "source": "練習メニュー200", "page": "Menu138/p180", "how_to": "①2人1組でネットを挟んで向き合う\n②しゃがんでいる相手の手の上で、つま先をタッチするようにブロックジャンプ\n③選手のジャンプ力に応じて手の高さを調整", "coaching_points": "・ネット上での到達点確認\n・くの字の姿勢でジャンプする感覚\n・2人で行うことで楽しみながら到達点を可視化", "variations": "なし", "target_players": "全員"}, {"genre": "ブロック", "no": 13, "id": "ブロック-13", "name": "両手をネットよりも前に出す", "category": "手の出し方", "purpose": "ゴムひもを張って手を前に出す感覚", "difficulty": "★★★", "min_people": 1, "equipment": "ゴムひも・ id": "レシーブ基礎-3", "name": "プラットフォーム直上", "category": "パス基礎", "purpose": "1枚の面を作る感覚（ひざ立ち・近距離強打）", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール1個", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu027/p46", "how_to": "①2人1組、1.5m離れて向き合う\n②1人がひざ立ちでアンダーハンドの面を作って構える\n③その面をめがけてパートナーが強打スパイクを打つ\n④10回繰り返し交代", "coaching_points": "・2本の腕が1つになり1枚の面（プラットフォーム）を作ることが基本\n・2本の腕がバラバラにボールに当たらないようにする\n・腕がズレる人は板やフラッグを持って実施するとよい", "variations": "なし", "target_players": "全員。面作りの基本"}, {"genre": "レシーブ基礎", "no": 4, "id": "レシーブ基礎-4", "name": "プラットフォーム直上4.5m", "category": "パス基礎", "purpose": "距離が離れても面を意識する", "difficulty": "★★★★★", "min_people": 2, "equipment": "ボール1個", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu028/p47", "how_to": "①2人1組、4.5m離れて向き合う\n②1人がひざ立ちでアンダーハンドの面を作って構える\n③その面をめがけてパートナーが強打スパイクを打つ\n④10回繰り返し交代", "coaching_points": "・距離が離れると腰が浮いて全部がバラバラになりやすい\n・距離が離れても腕が1枚の板になるよう面作りを意識\n・打ち手の技術も必要→難しい場合は投げてもOK\n・スパイカーのコントロール練習にもなる", "variations": "スパイクで打つ→投げるに変更可", "target_players": "全員"}, {"genre": "レシーブ基礎", "no": 5, "id": "レシーブ基礎-5", "name": "全屈伸アンダーキャッチ", "category": "パス基礎", "purpose": "落下地点に正しく入る練習", "difficulty": "★★★★★", "min_people": 2, "equipment": "ボール1個", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu029/p48", "how_to": "①2人1組、4.5m離れて向き合う\n②パートナーにボールを投げてもらう\n③全屈伸しながらボールをアンダーキャッチする\n④10回繰り返し交代", "coaching_points": "・全屈伸は捉えるポイントが1箇所に限定される\n・足が前後に開かないことが大事\n・蹲踞（そんきょ）の姿勢を意識して落下地点にしっかり入る\n・成長期の選手はひざを痛める可能性→数を少なくして確認程度に", "variations": "なし", "target_players": "落下地点に入れない選手に特に有効"}, {"genre": "レシーブ基礎", "no": 6, "id": "レシーブ基礎-6", "name": "全屈伸アンダーハンドパス", "category": "パス基礎", "purpose": "落下地点に入った状態から正確にパス", "difficulty": "★★★★★", "min_people": 2, "equipment": "ボール1個", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu030/p48", "how_to": "①2人1組、4.5m離れて向き合う\n②全屈伸しながらアンダーハンドパスをする\n③10回繰り返し交代", "coaching_points": "・落下地点に入るのはキャッチで練習済み→ここではパス精度を目指す\n・ボールをヒットすると同時にひざを伸ばすことが必要\n・全屈伸に集中してパスが乱れるケースが多い→パス精度を優先\n・成長期の選手はひざに注意→数を少なく", "variations": "距離を3m→4.5m→6mと段階的に伸ばす", "target_players": "全員"}, {"genre": "レシーブ基礎", "no": 7, "id": "レシーブ基礎-7", "name": "直上ソフトキャッチ＆パス4.5m", "category": "パス基礎", "purpose": "腕を振らずにボールをコントロール", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール1個", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu031/p49", "how_to": "①2人1組、4.5m離れて向き合う\n②アンダーハンドで直上にパスする\n③そのボールを1歩も動かずにオーバーハンドパスで相手に返す\n④10回繰り返し交代", "coaching_points": "・アンダーハンドパス時に腕をまっすぐ地面と平行にしたまま受ける\n・ボールを乗せる感覚で直上パス\n・面が後ろや前にいきすぎると次のOHパスにうまく移れない\n・腕を振らない意識づけ（強打に対してもコントロールできるように）", "variations": "距離を6m→9mに伸ばす", "target_players": "腕を振る癖がある選手に"}, {"genre": "レシーブ基礎", "no": 8, "id": "レシーブ基礎-8", "name": "3箇所レシーブ6m", "category": "パス基礎", "purpose": "移動しながら面を維持してパス", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール1個", "space": "半面", "duration": 10, "source": "基本を極めるドリル", "page": "Menu032/p50", "how_to": "①2人1組、6m離れて向き合う\n②1人がボールを中間くらいにシュッと投げる\n③もう1人が前進しながらアンダーハンドパス\n④パス後に数歩前進して蹲踞\n⑤バックステップでスタート地点に戻り、サイドステップで移動\n⑥再びボールを投げてもらい前進パス→蹲踞\n⑦反対側にサイドステップして3箇所目\n⑧3箇所を1セット×10セット", "coaching_points": "・2本の腕が1枚の板になってボールを乗せられているか確認\n・走りながらボールに足で合わせられているか確認\n・移動→停止→パスの流れを大切に", "variations": "ボールの速度を変える / 投げる位置を変える", "target_players": "移動しながらのパスが苦手な選手に"}, {"genre": "レセプション", "no": 3, "id": "レセプション-3", "name": "2人レセプション3m×3m", "category": "レセプション判断", "purpose": "狭いスペースで誰がとるか判断", "difficulty": "★★★★", "min_people": 3, "equipment": "ボール複数", "space": "半面", "duration": 10, "source": "基本を極めるドリル", "page": "Menu037/p57", "how_to": "①エンドラインからアタックラインまでの6m、サイドラインから内側3mのスペースに2人入る\n②コーチ役がサーブを打つ\n③2人でレセプションする\n④一定時間で交代", "coaching_points": "・早めに声を出す（どちらがとるか明確に）\n・レセプションはボールを点ではなく線でイメージすることが大事\n・飛んでくるボールを線でイメージすると、延長線上に誰がいるか想像できる\n・より早く判断できれば、より早い声出しにつながる", "variations": "スペースを広げる / 狭める", "target_players": "声出しが苦手な選手に"}, {"genre": "レセプション", "no": 4, "id": "レセプション-4", "name": "2人レセプション3m×3m（判断強化）", "category": "レセプション判断", "purpose": "声出しと判断スピードの向上", "difficulty": "★★★★", "min_people": 3, "equipment": "ボール複数", "space": "半面", "duration": 10, "source": "基本を極めるドリル", "page": "Menu038/p58", "how_to": "①エンドラインから内側3m、サイドラインから内側3mのスペースに2人入る\n②コーチ役がサーブを打つ\n③2人でレセプション\n④10本で交代", "coaching_points": "・さらに狭いスペースなので、すぐ隣に人がいる状態\n・最低でも相手コートのアタックラインをサーブが通過するときには判断\n・基本は後ろの人から声をかける\n・前の人も「オーライ」「頼む」等の声を出すと連携が取れる", "variations": "なし", "target_players": "2人の連携強化"}, {"genre": "レセプション", "no": 5, "id": "レセプション-5", "name": "5人レセプション4.5m角", "category": "レセプション判断", "purpose": "5人でのレセプション・線のイメージ", "difficulty": "★★★★", "min_people": 6, "equipment": "ボール複数", "space": "半面", "duration": 10, "source": "基本を極めるドリル", "page": "Menu039/p60", "how_to": "①コートの角4.5m四方のスペースに5人入る\n②コーチ役がサーブを打つ\n③5人でレセプション\n④10本で交代", "coaching_points": "・2人の時は「自分」か「あなた」の判断でよかったが、5人だと「誰がとるのか」になる\n・より正確に線（軌道）を描く必要がある\n・声出しのスピードと正確性が求められる", "variations": "4.5m→6mに広げる", "target_players": "チーム全員で"}, {"genre": "レセプション", "no": 6, "id": "レセプション-6", "name": "重なる練習（責任範囲確認）", "category": "レセプション判断", "purpose": "チーム内の責任範囲を決めて練習", "difficulty": "★★★★", "min_people": 6, "equipment": "ボール複数", "space": "半面", "duration": 10, "source": "基本を極めるドリル", "page": "Menu040/p61", "how_to": "①コートの角4.5m四方のスペースに5人入る\n②コーチ役がサーブを打つ\n③レセプション\n④5本で交代", "coaching_points": "・声を掛け合うことに加え、チーム内で責任範囲を決めておく\n・守備範囲はそれぞれ違うのであくまで原則\n・レセプションがうまい人は範囲を広げてもよい\n・サーバーの位置から近い人がとるのが大原則", "variations": "サーバーの位置を変える（右側/左側/中央）", "target_players": "チーム全員。特に責任の曖昧な選手間"}, {"genre": "レセプション", "no": 7, "id": "レセプション-7", "name": "ひじ伸ばしレセプション", "category": "レセプション技術", "purpose": "後方に下がりながらひじを伸ばしてレセプション", "difficulty": "★★★★", "min_people": 3, "equipment": "ボール複数", "space": "半面", "duration": 10, "source": "基本を極めるドリル", "page": "Menu041/p62", "how_to": "①3人1組、2人がコーナー4.5mのスペースに入る\n②コーチ役が相手コートのネット際に立つ\n③コーチがアンダーハンドサーブの要領でネット下を通して深めのボールを出す\n④2人が後方に下がりながらレセプション", "coaching_points": "・レセプションはひじをピンと伸ばす\n・後ろに下がるとき、手が前から引っ張られるようにして伸ばす\n・2人でボールの位置確認と同時に実施", "variations": "なし", "target_players": "深いサーブに対応が遅れる選手に"}, {"genre": "ディグ", "no": 11, "id": "ディグ-11", "name": "ステージレシーブ・アンダー", "category": "ディグ基礎", "purpose": "足下のボールを目線を下げてレシーブ（台上から）", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール・台/ステージ", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu044/p68", "how_to": "①2人1組、レシーバーが台上（学校のステージ等）で構える\n②コーチ役が4.5m離れたところからひざの間くらいにスパイクを打つ\n③レシーバーはボールの下に潜り込みながらレシーブ\n④10回で交代", "coaching_points": "・上からボールを見ている選手は足下のボールが上がらない\n・目線を下げることで足下のボールもとれるようになる\n・特にひざが曲がらない背の高い選手に有効\n・ステージのギリギリを狙って足のつま先目がけて打つ\n・難しい場合は投げてもOK", "variations": "ステージレシーブ・オーバー（オーバーハンドでレシーブ。低い・高い両方に対応）", "target_players": "長崎に特に有効（173cmで足下が苦手な可能性）"}, {"genre": "ディグ", "no": 16, "id": "ディグ-16", "name": "壁つきステップ", "category": "ディグ基礎", "purpose": "肩を開かずにディグする（壁を使ったフォーム矯正）", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール・壁", "space": "壁のある場所", "duration": 5, "source": "基本を極めるドリル", "page": "Menu045/p70", "how_to": "①2人1組、レシーバーが壁に両肩をつけて構える\n②コーチ役が4.5m離れたところからボールを投げる\n③レシーバーは壁に肩をつけたままノーステップ/1ステップ/2ステップでレシーブ\n④左右各10回で交代", "coaching_points": "・ディグで後ろに弾かないためのドリル\n・肩を開くと自分の肘が壁に当たるので間違いに気づきやすい\n・両肩をつけて正面でとることを徹底\n・ステップを横にしても壁から肩が離れないようにする", "variations": "反対側も同様に実施", "target_players": "ディグが後ろに弾かれる選手全員に必須"}, {"genre": "ディグ", "no": 15, "id": "ディグ-15", "name": "2ステップ＋クロスオーバー", "category": "ディグ移動", "purpose": "離れたボールをステップで追う（かかとから入る）", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール1個", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu046/p71", "how_to": "①2人1組、4.5m離れて向き合う\n②パートナーに3m以上離れたところからボールを投げてもらう\n③ステップ→クロスオーバーで追ってレシーブ\n④左右各10回", "coaching_points": "・最後の1歩は大きく、かかとで入る\n・かかとから入ることでボールを捉えた後にクルッと方向転換→次の動作に移りやすい\n・距離が離れたボールでもなるべく肩を回さない\n・ワンタッチボールにもよく使われる技術", "variations": "なし", "target_players": "全員。特に守備範囲を広げたい選手"}, {"genre": "レシーブ基礎", "no": 10, "id": "レシーブ基礎-10", "name": "体重支え", "category": "ダイビング基礎", "purpose": "両腕で体重を支える感覚（恐怖心除去）", "difficulty": "★★", "min_people": 1, "equipment": "なし（エアマット推奨）", "space": "どこでも", "duration": 5, "source": "基本を極めるドリル", "page": "Menu047/p72", "how_to": "①立てひざの状態から床に向かってゆっくり身体を前に倒す\n②両手で身体を支える\n③5回繰り返す", "coaching_points": "・ダイビングレシーブができない人はまず怖さを取り /p76", "how_to": "①2人1組、レシーバーとコーチ役に分かれる\n②コーチは2mくらい離れて立つ\n③レシーバーは構えた状態から右斜め前に2ステップ\n④コーチが右前あたりに低いボールを投げる\n⑤レシーブしてからフライング\n⑥すぐに立ち上がり左斜め前に2ステップ→同様に\n⑦繰り返す", "coaching_points": "・ダイビングレシーブ習得ドリルのまとめ的なメニュー\n・ギリギリまで跳ばない\n・球出しが重要→フライングしやすいところに正確に投げる\n・ひざより低い位置からボールをポロンと落とすように出す", "variations": "なし", "target_players": "全員"}, {"genre": "レシーブ基礎", "no": 15, "id": "レシーブ基礎-15", "name": "3本指キャッチ", "category": "パス基礎（OH）", "purpose": "オーバーハンドの正しいキャッチ感覚", "difficulty": "★★", "min_people": 2, "equipment": "ボール1個", "space": "どこでも", "duration": 5, "source": "練習メニュー200", "page": "Menu015/p46", "how_to": "①2人組になる\n②オーバーハンドパスの正しいフォームで構える\n③投げてもらったボールを3本の指（親指・人差し指・中指）でキャッチ\n④薬指と小指は軽く添える程度", "coaching_points": "・手のひら全体でガシャッと受けるのはNG\n・手のひらに丸みをもたせ、指先から中ほどあたりでボールをとらえる\n・指を前に突き出すと突き指の危険→初級者は十分注意してサポート", "variations": "なし", "target_players": "OH基礎が弱い選手全員に"}, {"genre": "レシーブ基礎", "no": 16, "id": "レシーブ基礎-16", "name": "手首スナップ（メディシンボール）", "category": "パス基礎（OH）", "purpose": "手首のスナップ力を強化", "difficulty": "★★", "min_people": 2, "equipment": "メディシンボール", "space": "どこでも", "duration": 5, "source": "練習メニュー200", "page": "Menu016/p46", "how_to": "①2人組になる\n②オーバーハンドパスの正しいフォームで構える\n③投げてもらったメディシンボールを手首のスナップを使って返す", "coaching_points": "・手首が内に回ってしまってはダメ\n・左右の手の位置がズレていたり力の入れ加減が揃っていないとボールに回転がかかる\n・500gの5号球使用（350g、400gもあり、チームレベルに応じて選択）", "variations": "ボールの重さを変える", "target_players": "手首のスナップが弱い選手に"}, {"genre": "レシーブ基礎", "no": 17, "id": "レシーブ基礎-17", "name": "板でとらえる", "category": "パス基礎（UH）", "purpose": "2本の腕で1枚の面を作る感覚", "difficulty": "★★", "min_people": 2, "equipment": "板orファイル", "space": "どこでも", "duration": 5, "source": "練習メニュー200", "page": "Menu017/p47", "how_to": "①2人組になる\n②アンダーハンドパスの正しいフォームで構える\n③用意した板（A4サイズ程度）を持って、投げてもらったボールを板でとらえる", "coaching_points": "・「2本の腕で1枚の面をつくる」という感覚を身につける\n・板がなければ雑誌などで代用可", "variations": "なし", "target_players": "面作りの感覚がつかめない選手に"}, {"genre": "レシーブ基礎", "no": 18, "id": "レシーブ基礎-18", "name": "バケツキャッチ", "category": "パス基礎（UH）", "purpose": "正面でボールを受ける感覚", "difficulty": "★★", "min_people": 2, "equipm ers": "チーム全員。週末の実戦練習に"}, {"genre": "レセプション", "no": 2, "id": "レセプション-2", "name": "移動レシーブ成功率テスト", "category": "レセプション測定", "purpose": "チャンスボール10本→セッター位置への返球で計測", "difficulty": "★★★", "min_people": 2, "equipment": "ボール複数", "space": "全面", "duration": 10, "source": "ひろきオリジナル", "page": "-", "how_to": "①対面からチャンスボール10本を出す\n②セッター位置への返球で計測\n③成功・失敗を記録\n④定期的に測定して成長を可視化", "coaching_points": "・守備の実用精度を測定する\n・セッター位置への返球精度がポイント\n・数値化することで成長が見え、動機づけにつながる", "variations": "ボールのスピードを上げる / 移動距離を変える", "target_players": "全員（定期測定用）"}, {"genre": "レシーブ基礎", "no": 1, "id": "レシーブ基礎-1", "name": "バタフライパス", "category": "パス・判断（ゲーム形式）", "purpose": "3人組：投げ→パス→セット→ターゲット。5本成功で交代", "difficulty": "★★★", "min_people": 3, "equipment": "ボール複数", "space": "全面", "duration": 10, "source": "Reynaud", "page": "Ch8/Session1", "how_to": "①3人1組（投げ役・パス役・セット役）\n②投げ役がネット越しにボールを投げる（深い/短いを変化させる）\n③パス役がレセプション\n④セット役がターゲット（コート中央）に高くセット\n⑤5本成功（良いパス）で交代・ローテーション", "coaching_points": "・前後の動きを入れたパス練習\n・レベルを維持して同じ高さで動く（頭の上下動を減らす）\n・投げの質を変えることで実戦的な対応力を養う", "variations": "投げ→サーブに変更 / 成功回数を増やす", "target_players": "全員。ウォームアップ後の基礎練習に最適"}, {"genre": "レセプション", "no": 1, "id": "レセプション-1", "name": "15本パーフェクトパス", "category": "サーブレシーブ（ゲーム形式）", "purpose": "パス3人+セッター vs サーバー。パーフェクトパス15本を目指す（得点制）", "difficulty": "★★★★", "min_people": 6, "equipment": "ボール複数・スコアボード", "space": "全面", "duration": 15, "source": "Reynaud", "page": "Ch8/Session3", "how_to": "①チームを半分に分ける（サーバー組 vs パサー組）\n②パサー組：3人+セッターがコートに入る、残りはサイドラインで待機\n③サーバーがサーブ→パサーがレセプション→セッターがセット\n④パーフェクトパス=1点、エースやネット返球=-1点\n⑤15点を目指す（レベルに応じて目標点数を調整）\n⑥ポータブルスコアボードで得点管理", "coaching_points": "・サーブは攻めるが、ミスしすぎないよう注意\n・得点制にすることで競争心とプレッシャー耐性を養う\n・サーブレシーブの精度を数値化して可視化", "variations": "目標点数を変える / サーバーの人数を変える / サーブの種類を指定", "target_players": "全員。サーブミス率15.2%の改善にも直結（サーバー側）"}, {"genre": "ディグ", "no": 9, "id": "ディグ-9", "name": "フリーボール→ターゲット返球", "category": "チャンスレシーブ（チーム形式）", "purpose": "3列でエンドライン後方から入り、フリーボールをターゲットにパス。チームで20本成功が目標", "difficulty": "★★★", "min_people": 6, "equipment": "ボール複数", "space": "全面", "duration": 15, "source": "Reynaud", "page": "Ch8/Session5", "how_to": "①3列でエンドライン後方に配置\n②ネット越しにフリーボールが来る\n③前の人がパスし終わったらコートに入り、フリーボールをターゲットにパス\n④パス後はバックウォールまでジョグ→別の列の後ろに並ぶ\n⑤チーム全体で20本のパーフェクトパスが目標", "coaching_points": "・フリーボールは確実に処理する意識づけ\n・移動→停止→パスの流れ\n・チーム全体の目標として一体感を持たせる", "variations": "目標本数を増やす / フリーボールの速度を変える", "target_players": "全員。チャンスボール処理ミスの撲滅に"}, {"genre": "ディグ", "no": 10, "id": "ディグ-10", "name": "ランスルー（走り込みレシーブ）", "category": "反応レシーブ", "purpose": "ネット越しにティップされたボールを走り込んでパス→ターゲットへ。10本成功で交代", "difficulty": "★★★", "min_people": 3, "equipment": "ボール複数", "space": "全面", "duration": 10, "source": "Reynaud", "page": "Ch8/Session6", "how_to": "①1人がネットの反対側でボールをティップ\n②他の選手がサイドラインに1列で並ぶ\n③ティップされたボールに走り込んでパス→ターゲット（コート中央）\n④パス後にコート外に出て列の最後尾へ\n⑤10本成功で役割交代", "coaching_points": "・走りながら止まってパスする技術\n・足でボールに合わせて身体の正面で受ける\n・腕の角度を調整してコート中央に返球\n・最後まで足で踏ん張って立ったままプレー", "variations": "ティップの方向を変える / 速度を上げる", "target_players": "全員。ランニングレシーブの基礎"}, {"genre": "ディグ", "no": 12, "id": "ディグ-12", "name": "ステージレシーブ・オーバー", "category": "ディグ基礎", "purpose": "低い・高いボール両方にオーバーで対応", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール・台/ステージ", "space": "半面", "duration": 5, "source": "基本を極めるドリル", "page": "Menu044Extra", "how_to": "①Menu044と同じ配置\n②同じ要領でオーバーハンドでレシーブする\n③低いボール・高いボール両方に反応\n④10回で交代", "coaching_points": "・1995年ルール改正でオーバーハンドディグが可能に\n・低いボールはアンダー、高いボールはオーバーと使い分ける練習\n・上体を起こしたパワーポジションからの反応", "variations": "アンダー/オーバーをランダムに", "target_players": "全員。オーバーでのディグに慣れていない選手"}, {"genre": "ディグ", "no": 13, "id": "ディグ-13", "name": "壁つきステップ（ノーステップ）", "category": "ディグ基礎", "purpose": "肩を開かずに正面でディグ（壁でフォーム矯正）", "difficulty": "★★★★", "min_people": 2, "equipment": "ボール・壁", "space": "壁のある場所", "duration": 5, "source": "基本を極めるドリル", "page": "Menu045/p70", "how_to": "①2人1組、レシーバーが壁に両肩をつけて構える\n②コーチ役が4.5m離れたところからボールを投げる\n③レシーバーは壁に肩をつけたままノーステップでレシーブ\n④左右各10回で交代", "coaching_points": "・ディグで後ろに弾かないためのドリル\n・肩を開くと自分の肘が壁に当たるので間違いに気づきやすい\n・両肩をしっかりつけて正面でとることを徹底\n・ディグの最重要基礎ドリルの1つ", "variations": "ノーステップ→1ステップ→2ステップと段階的に", "target_players": 上\n②守備システム（6アップ/6ダウン等）を使ったゲーム形式\n③実際のフォーメーションで得点を競う\n④ローテーションを入れて実施", "coaching_points": "・ベースポジション→リードポジションへの移行を実戦で確認\n・各ポジションの守備範囲と動きの約束事を実行\n・ゲーム形式なのでプレッシャー下での判断力も養われる", "variations": "守備システムを変えて比較（6アップ vs 6ダウン等）", "target_players": "チーム全員。週末の実戦練習に"}, {"genre": "ディグ", "no": 45, "id": "ディグ-45", "name": "ブロックフォローからのラリーゲーム", "category": "ディグ実戦", "purpose": "ブロックフォロー→ラリーのゲーム形式", "difficulty": "★★★★★", "min_people": 6, "equipment": "ボール複数", "space": "全面", "duration": 20, "source": "練習メニュー200", "page": "Menu177/p220", "how_to": "①6人以上\n②ブロックフォロー→ラリーのゲーム形式\n③味方のスパイクがブロックされた後の対応を練習\n④得点制で競う", "coaching_points": "・ブロックされた後のフォロー→再攻撃の流れ\n・「ラリーを制する」意識\n・チーム全員がフォローの意識を持つ\n・連続失点回避のための重要な練習", "variations": "ウォッシュ（WASH）ゲームと組み合わせる", "target_players": "チーム全員。連続失点回避の鍵"}, {"genre": "ディグ", "no": 1, "id": "ディグ-1", "name": "6人ペッパー", "category": "チームディグ", "purpose": "6人同じ側でWS2人がヒット→他4人がディグ→セッターがセット→繰返し", "difficulty": "★★★★", "min_people": 6, "equipment": "ボール複数", "space": "全面", "duration": 10, "source": "Reynaud", "page": "Ch8/Session3", "how_to": "①6人全員がコートの同じ側に配置\n②外側の2人（WS）がネットに向かい、チームメイトに向かってヒット\n③残りの4人が通常の守備位置でディグ\n④ミドルフロントがセットしてWSに返す\n⑤一定本数ディグ成功で交代。全員が全ポジション経験", "coaching_points": "・ベースディフェンスポジションからスタート\n・ディフェンス選手はヒットを読んで声に出す\n・ヒット/ディグ/セットを大量にこなせる\n・読みと守備移動の練習が自然に入る", "variations": "1分ごとにローテーション / ディグ成功数でカウント", "target_players": "全員。ウォームアップにも週末練習にも使える"}, {"genre": "ディグ", "no": 2, "id": "ディグ-2", "name": "ライブヒッター対ディグ", "category": "ライブヒッター対ディグ", "purpose": "2v3。ディガーがライン方向に配置。ヒッターがライン方向にスパイク→ディグ。2本成功で交代", "difficulty": "★★★★", "min_people": 5, "equipment": "ボール複数", "space": "全面", "duration": 15, "source": "Reynaud", "page": "Ch8/Session2", "how_to": "①チームA：ディガー1人（ライン方向）＋ボール送り役1人\n②チームB：パサー1人＋セッター1人＋ヒッター1人\n③A側がボールをネット越しに送る→B側がパス→セット→レフトからライン方向にスパイク\n④Aのディガーがライン方向でディグ→コート中央に返球\n⑤2本良いディグで交代。全ポジション回す", "coaching_points": "・スパイクをネットから90cm離してセット→ヒッターが安全にスイング\n・打点の前にボールを置く\n・ヒッターの腕のフォロースルーがディガー方向を示す\n・ディガーはベースポジション→ディフェンスポジションに移動→ディグ→コート中央へ返球", "variations": "2コート使用で全員参加 / ディグ方向をクロスに変更", "target_players": "全員。実戦的なディグ練習の入口"}, {"genre": "ディグ", "no": 3, "id": "ディグ-3", "name": "1ブロッカー＋2ディガー対ライブヒッター", "category": "ブロック＋ディグ連携", "purpose": "3v3。ブロッカー1+ディガー2 vs ヒッター。ブロッカーは中央を守り、ディガーはライン/クロスに配置", "difficulty": "★★★★★", "min_people": 6, "equipment": "ボール複数", "space": "全面", "duration": 20, "source": "Reynaud", "page": "Ch8/Session2", "how_to": "①チームA：ブロッカー1人＋ディガー2人（ライン＋クロス）\n②チームB：パサー1人＋セッター1人＋ヒッター1人\n③A側がボール送り→B側がパス→セット→スパイク\n④Aのブロッカーが中央を守り、ディガーがライン/クロスでディグ\n⑤2本良いコンタクトで交代", "coaching_points": "・ブロッカーは手をネット越しに正しいタイミングで出す\n・ディガーはブロッカーの周りに配置→ヒッターとボールが見える位置\n・ブロッカーとディガーがボールの行き先を声に出して予測\n・トータルディフェンスの最小構成単位", "variations": "2コート使用 / ブロッカーを2枚に増やす", "target_players": "鈴木＋長崎のブロック＋池田・白岩のディグ連携に最適"}, {"genre": "ディグ", "no": 4, "id": "ディグ-4", "name": "後衛3人＋セッター", "category": "後衛3人＋セッター", "purpose": "後衛3人がディグ→セッターがダンプorセット→後衛がバックアタック。ミスしたらコーチが追加球", "difficulty": "★★★★★", "min_people": 5, "equipment": "ボール複数", "space": "全面", "duration": 10, "source": "Reynaud", "page": "Ch8/Session4", "how_to": "①4人1組（後衛3人＋セッター1人）をコートに配置\n②余った選手がネット越しにサーブ\n③後衛3人のうち1人がディグ→セッターへ\n④セッターがダンプ（ツーアタック）orセット→後衛がバックアタック\n⑤ミスしたらコーチが追加球→成功体験を積ませる", "coaching_points": "・コーチが追加球を出す→選手に成功体験の機会を与える\n・全員がトランジション動作を経験\n・セッターのダンプ判断力も鍛えられる\n・サーブ/パス/セット/アタック/リーディング/ディフェンスの総合練習", "variations": "後衛のバックアタックなしバージョン（最初は2段トスのみ）", "target_players": "全員。特にセッター候補の池田に良い経験"}, {"genre": "ディグ", "no": 5, "id": "ディグ-5", "name": "ネット越しペッパー", "category": "ネット越しペッパー", "purpose": "半面3v3。ヒット→ディグ→セット→スタンディングヒットを繰返す（2分交代）", "difficulty": "★★★★", "min_people": 6, "equipment": "ボール複数", "space": "半面", "duration": 10, "source": "Reynaud", "page": "Ch8/Session3", "how_to": "①半面を使い3v3で配置\n②ボールをトスアップ→スタンディングでヒット→相手側がディグ→セット→スタンディングヒット\n③この流れを2分間繰り返す\n④グループ入替", "coaching_points": "・ウォームアップに最適\n・大量のボールコンタクトが得られる\n・ヒットを読んで動くディフェンスの基礎\n・ボールコントロール力の向上", "variations": "フルコートで実施 / クロス限定バージョン", "target_players": "全員。ウォームアップとして"}, {"genre": "ディグ", "no": 6, "id": "ディグ-6", "name": "ネット越しクロスペッパー", "category": "ネット越しクロスペッパー", "purpose": "半面3v3。クロス方向限定のヒット→ディグ→セットを繰返す", "difficulty": "★★★★", "min_people": 6, "equipment": "ボール複数", "space": "半面", "duration": 10, "source": "Reynaud", "page": "Ch8/Session5", "how_to": "①半面3v3。ネット越しペッパーと同じ要領\n②ただしクロス方向限定でヒット\n③ディグ→セット→クロスヒットの繰返し\n④2分で交代", "coaching_points": "・クロスヒットの読みと対応\n・クロスへのディグ位置の確認\n・ヒット方向が限定されるため、ディグの精度を上げやすい", "variations": "ストレート限定バージョンも実施", "target_players": "全員"}, {"genre": "ディグ", "no": 7, "id": "ディグ-7", "name": "チームディフェンス6対4", "category": "チームディフェンス", "purpose": "6人ディフェンス vs 4人（3ヒッター+セッター）。ブロック＋ディグでターゲットに返球=1点", "difficulty": "★★★★★", "min_people": 10, "equipment": "ボール複数", "space": "全面", "duration": 30, "source": "Reynaud", "page": "Ch8/Session5", "how_to": "①チームA：6人フルチームでディフェンス\n②チームB：3ヒッター＋1セッター\n③Aがサーブ→Bがパス→セッターがダンプorセット→ヒッターがアタック\n④Aがブロック＋ディグ→ターゲット（コート中央）に返球=1点\n⑤Bはキルで1点。5点先取で交代", "coaching_points": "・チームディフェンスの総合確認\n・読み→移動→ブロック＋ディグの一連の流れ\n・ディグをターゲットに返球できたら得点（ただ上げるだけではなく精度が必要）\n・トランジション（ディグ→攻撃）まで発展可", "variations": "得点ルールを変える / ディフェンスからの攻撃まで含める", "target_players": "チーム全員。週末練習の柱に"}, {"genre": "ディグ", "no": 8, "id": "ディグ-8", "name": "6対6 ウォッシュ（WASH）ドリル", "category": "ウォッシュ（WASH）ゲーム", "purpose": "6v6。最初のラリー勝ち→フリーボールラリーも勝ちで得点＋ローテ。負ければ「ウォッシュ（WASH）」で無得点", "difficulty": "★★★★★", "min_people": 12, "equipment": "ボール複数・スコアボード", "space": "全面", "duration": 20, "source": "Reynaud", "page": "Ch8/Session4", "how_to": "①6v6のゲーム形式\n②最初のラリーを勝った側が「チャンス」を獲得\n③続いてコーチがフリーボールを出す→そのラリーも勝てば1点＋ローテーション\n④フリーボールラリーを負ければ「ウォッシュ（WASH）」→どちらも得点なし\n⑤より多くローテーションしたチームが勝ち", "coaching_points": "・「ラリーを2連続で勝つ」必要がある→連続得点力と集中力を養う\n・ウォッシュ（WASH）=やり直し→連続失点の怖さを体感できる\n・フリーボールの確実な処理が必須\n・チーム課題2「連続失点の回避」に直結する最高のドリル", "variations": "フリーボールの代わりにサーブから / 3連続勝ちで得点に変更", "target_players": "チーム全員。連続失点回避の切り札ドリル"}, {"id": "佐藤定番-1", "genre": "身体の使い方", "no": 1, "name": "統一アップ", "category": "統一アップ", "purpose": "練習開始時の体温上昇・神経系活性化・対人コンタクト導入を一連の流れで実施", "difficulty": "★★", "min_people": 2, "equipment": "なし", "space": "どこでも", "duration": 30, "source": "佐藤定番メニュー", "how_to": "①ジョギング1分(コート半分でぐるぐる)\n②ダイナミックストレッチ6種目(サイドラインからサイドラインまで歩きながら)\n③ドリル：スキップ×1、ツイスト走(左右)×1、バック走×1、ダッシュ×2\n④対人キャッチボール 30秒×3：チェストパス／両手投げ／両手叩きつけ\n⑤対人キャッチボール 1分×3：打ち付け／ドライブ回転(胸へ)／無回転(胸へ)\n⑥対人パス 1分×2：アンダー／オーバー\n⑦スパイク&レシーブ：膝つきレシーブ10本×双方／立ちレシーブ10本×双方\n⑧対人レシーブ 3分×2", "coaching_points": "・段階的に強度を上げる(歩く→走る→打つ)\n・対人キャッチボールでフォームを毎日確認\n・最後の対人レシーブはコール(声出し)も意識する", "variations": "休日全面のときは⑧の後にゲーム形式アップ(ミカサモルテン／2対2／1対1)を続けて入れる", "target_players": "全員。育休中もこの30分構成は基本変更しない"}, {"id": "佐藤定番-2", "genre": "レセプション", "no": 2, "name": "反対コート台からのサーブ球出し", "category": "佐藤定番", "purpose": "ネット越しに飛んでくるサーブを連続で受けて、サーブレシーブの感覚を養う", "difficulty": "★★★", "min_people": 3, "equipment": "ボール多数、台(ステージ等)", "space": "半面", "duration": 12, "source": "佐藤定番メニュー", "how_to": "①反対コートに台(ステージ等)を設置\n②台の上から指導者or選手がサーブ風の球出し\n③受け手は1人で連続10本レシーブ → 交代\n④2セット行い、1回目はアンダー、2回目はオーバーで処理\n⑤全員順番にローテ", "coaching_points": "・腕の面を作って、目線をボールの軌道に合わせる\n・1本ごとに体勢を作り直す(次の球を待つ姿勢に戻る)\n・オーバー回はボールを「下から見る」意識でデコ前で取る", "variations": "球出しの強度を上げ下げできる／投げ込みからスパイク球出しに変えればディグ練習に転用可", "target_players": "全員。レセプション基礎を固めたい時期に"}, {"id": "佐藤定番-3", "genre": "レセプション", "no": 3, "name": "幅狭め2人レセプション", "category": "佐藤定番", "purpose": "コート幅を狭くした条件で、2人での責任分担とコミュニケーションを身につける", "difficulty": "★★★", "min_people": 3, "equipment": "ボール多数、アンテナ2本", "space": "半面", "duration": 5, "source": "佐藤定番メニュー", "how_to": "①球出し役を固定(コーチor選手)\n②アンテナをコート上に立てて幅を挟み、サイドの境界はコート上の既存ライン(バスケライン等)を使う\n③受け手2人が並列で構え、責任エリアを分担\n④連続でサーブ風の球を出し、声を出し合いながらレシーブ\n⑤一定本数で交代", "coaching_points": "・「自分」「お願い」のコールを必ず出す\n・お見合いとなる中央付近の球はあらかじめ担当を決めておく\n・幅が狭いので、横移動より構え直しを優先", "variations": "ミスの度に「いま誰が取るボールだったか」を全員で確認する", "target_players": "全員。お見合い癖の選手に特に有効"}, {"id": "佐藤定番-4", "genre": "レセプション", "no": 4, "name": "幅狭め3人レセプション", "category": "佐藤定番", "purpose": "3人体制で責任分担と中央のオーバーラップ判断を学ぶ", "difficulty": "★★★", "min_people": 4, "equipment": "ボール多数、アンテナ2本", "space": "半面", "duration": 5, "source": "佐藤定番メニュー", "how_to": "①球出し役を固定\n②アンテナで幅を絞り、サイドの境界は既存ラインを使う\n③受け手3人で構え、左・中・右の責任エリアを分担\n④連続でサーブ風の球出し\n⑤声を出して取り合いながらレシーブ", "coaching_points": "・隣との境界線は「やや遠い人が取りに行かない」を原則に\n・中央の人はサポートに動きすぎず自分の範囲を守る\n・前後の球は前の人を優先する", "variations": "コートの幅を段階的に変えて難易度調整", "target_players": "全員。3人レセプションのフォーメーション学習に"}, {"id": "佐藤定番-5", "genre": "レセプション", "no": 5, "name": "6人レセプション点数制(15点)", "category": "佐藤定番", "purpose": "サーブ→レセプション→攻撃完結まで実戦と同じ条件で行い、攻撃まで決めきる意識を高める", "difficulty": "★★★★", "min_people": 7, "equipment": "ボール多数", "space": "全面", "duration": 25, "source": "佐藤定番メニュー", "how_to": "①6人がコートに入り通常のフォーメーションで構える\n②反対側コート(or 球出し台)からサーブ風の球を出す\n③ラリーは攻撃完結まで継続\n④得点ルール：\n　・スパイクで返球＝3点\n　・スパイク以外で3本目に返球＝1点\n　・返球できず＝-1点\n　・それ以外＝0点\n⑤累積15点に達したら全員1ポジション時計回りにローテ", "coaching_points": "・3点を狙う＝攻撃まで完結させる意識\n・「3本で必ず返す」ルールが意識付けられる\n・マイナス点があるので、返せない苦しさが数値で可視化される", "variations": "8人なら6v3形式(守備6＋反対側に3＝サーバー1・ブロッカー1・ディガー1)／点数を10点や20点に調整可", "target_players": "全員。ローテごとの弱点把握にも使える"}, {"id": "佐藤定番-6", "genre": "ディグ", "no": 6, "name": "三角レシーブ(4人連続)", "category": "佐藤定番", "purpose": "4人以上で三角形を作り、ディグ→トス→スパイクを移動しながら連続で行うつなぎ練習", "difficulty": "★★★★", "min_people": 4, "equipment": "ボール1個", "space": "半面", "duration": 10, "source": "佐藤定番メニュー", "how_to": "①4人以上でコート上に三角形を作る\n②球出しorスパイクから開始\n③ディグ→セッター役へトス→スパイカー役が打つ→相手側がディグ…と循環\n④ディグした人は次のトス役、トスした人は次の打ち手など、各自役割を移動\n⑤連続○本(例：10本)を目指す", "coaching_points": "・自分が打った後すぐ次の役割の場所へ移動\n・トスの正確さがつながりやすさを左右する\n・三角の頂点を意識して動く", "variations": "人数を増やして四角形にしたり、「○本連続成功で終わり」のチームミッション形式にも", "target_players": "全員。連携と移動の感覚作りに"}, {"id": "佐藤定番-7", "genre": "ディグ", "no": 7, "name": "ゴールを狙え(バスケループ狙い)", "category": "佐藤定番", "purpose": "バスケットゴールを的にしてパスをつなぎ、コントロールとつなぎの粘りを養う", "difficulty": "★★★", "min_people": 2, "equipment": "ボール1個", "space": "どこでも", "duration": 10, "source": "佐藤定番メニュー", "how_to": "①2〜4人組を作る\n②体育館の端のバスケットゴールを的にする\n③ボールを落とさずパスをつなぎ続ける\n④ゴール(ループ)を狙ってパスを入れる\n⑤入っても入らなくてもボールを落とさず継続\n⑥目標：ループに○本入れる(例：5本)", "coaching_points": "・ゴールを狙う＝高めのコントロールパスが必要\n・つなぎは焦らず、まず「落とさない」を優先\n・声を出して次に取る人を確認", "variations": "2人組ならコントロール重視、4人組なら役割分担あり／高校女子なら3〜5本でも十分達成感", "target_players": "全員。アップ後の遊び感覚で導入もよい"}, {"id": "佐藤定番-8", "genre": "ディグ", "no": 8, "name": "スリーメン", "category": "佐藤定番", "purpose": "3人レシーバー // ========== ユーティリティ ==========
function getDrill(id) { return ALL_DRILLS.find(d => d.id === id); }
function isCustom(d) { return d && d.source === '自作'; }
function diffNum(s) { return (s || '').length; }
function spaceOk(d, sp) {
  if (!sp) return true;
  if (d.space === 'どこでも') return true;
  if (sp === 'コートなし') return d.space === 'どこでも' || (d.space||'').includes('壁') || (d.space||'').includes('エンド');
  if (sp === '半面') return d.space === '半面' || d.space === 'どこでも' || (d.space||'').includes('壁') || (d.space||'').includes('エンド');
  if (sp === '全面') return true;
  return true;
}
function levelMatch(d, l) {
  const n = diffNum(d.difficulty);
  if (l === '基礎重視') return n <= 3;
  if (l === '実戦寄り') return n >= 3;
  return true;
}
function peopleOk(d, p) { return (d.min_people || 1) <= p; }
function isSato(d) { return d && d.source === '佐藤定番メニュー'; }
function isLockedDrill(d) { return d && d.source === '佐藤定番メニュー' && d.category === '統一アップ'; }
// 佐藤定番優先ソート（リスト表示用）
function sortSatoFirst(arr) {
  return arr.slice().sort((a, b) => {
    const sa = isSato(a) ? 0 : 1;
    const sb = isSato(b) ? 0 : 1;
    if (sa !== sb) return sa - sb;
    return 0;
  });
}
function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { if (state.toast === msg) { state.toast = null; render(); } }, 2700);
}

// 並行用の特殊ドリルID（セッター練習）
const PARALLEL_SETTER_ID = '佐藤定番-24';

// セットで実施すべきドリルグループ（コース別など）
// 1つが選ばれたら、同グループの残りも自動的に追加される
const PAIR_GROUPS = [
  // 2人組スパイクレシーブ：ストレート/クロス/インナークロスはセット
  ['ディグ-26', 'ディグ-27', 'ディグ-28'],
];
function getPairedDrills(drillId) {
  for (const group of PAIR_GROUPS) {
    if (group.includes(drillId)) {
      return group.filter(id => id !== drillId);
    }
  }
  return [];
}

// ========== 順序固定メニュー生成 ==========
function generateOrderedMenu(filters) {
  const { space, people, level, selectedSteps, stepCounts, preferSato } = filters;
  const menu = [];
  const stepMap = {};
  const parallel = {};
  const usedIds = new Set();
  for (const step of ORDER_FLOW) {
    if (!selectedSteps.includes(step.key)) continue;
    const count = (stepCounts && stepCounts[step.key]) || 1;
    
    let basePool = ALL_DRILLS.filter(d =>
      step.match(d) && spaceOk(d, space) && peopleOk(d, people)
    );
    if (step.key !== 'warmup' && step.key !== 'gameWarmup' && step.key !== 'stretch') {
      const lv = basePool.filter(d => levelMatch(d, level));
      if (lv.length > 0) basePool = lv;
    }
    if (preferSato) {
      const sato = basePool.filter(isSato);
      if (sato.length > 0) basePool = sato;
    }
    
    // count個まで選ぶ。カテゴリの多様性を優先
    const picked = [];
    const usedCatsInStep = [];
    for (let i = 0; i < count; i++) {
      let cands = basePool.filter(d => !usedIds.has(d.id) && !picked.find(p => p.id === d.id));
      if (cands.length === 0) break;
      if (usedCatsInStep.length > 0) {
        const diverse = cands.filter(d => !usedCatsInStep.includes(d.category));
        if (diverse.length > 0) cands = diverse;
      }
      const pick = pickRandom(cands);
      picked.push(pick);
      usedCatsInStep.push(pick.category);
    }
    
    // 難易度の昇順 → 所要時間の昇順（基礎→応用→実戦の流れ）
    picked.sort((a, b) => {
      const dn = diffNum(a.difficulty) - diffNum(b.difficulty);
      if (dn !== 0) return dn;
      return (a.duration || 0) - (b.duration || 0);
    });
    
    // メニューに追加（ペアドリルがあれば一緒に追加）
    let parallelAssigned = false;
    for (const p of picked) {
      menu.push(p.id);
      stepMap[p.id] = step.key;
      usedIds.add(p.id);
      
      // ペアグループのドリルがあれば追加（順序は登録順）
      const paired = getPairedDrills(p.id);
      for (const pairId of paired) {
        if (!usedIds.has(pairId)) {
          const pd = getDrill(pairId);
          if (pd && step.match(pd) && spaceOk(pd, space) && peopleOk(pd, people)) {
            menu.push(pairId);
            stepMap[pairId] = step.key;
            usedIds.add(pairId);
          }
        }
      }
      
      // スパイクで並行ペアセットを付与
      if (step.key === 'spike' && p.needs_setter === false && !parallelAssigned) {
        const pd = getDrill(PARALLEL_SETTER_ID);
        if (pd && peopleOk(pd, people)) {
          parallel[p.id] = PARALLEL_SETTER_ID;
          parallelAssigned = true;
        }
      }
    }
  }
  return { menu, stepMap, parallel };
}

// ========== 別案 ==========
function getAlternatives(drillId, currentMenuIds, filters, excluded) {
  const orig = getDrill(drillId);
  if (!orig) return [];
  const exSet = new Set(excluded || []);
  const pool = ALL_DRILLS.filter(d =>
    d.id !== orig.id && !currentMenuIds.includes(d.id) && !exSet.has(d.id) &&
    d.genre === orig.genre &&
    spaceOk(d, filters.space) && peopleOk(d, filters.people)
  );
  if (pool.length === 0) return [];
  const sameCatSameLv = pool.filter(d => d.category === orig.category && d.difficulty === orig.difficulty);
  const sameCatDiffLv = pool.filter(d => d.category === orig.category && d.difficulty !== orig.difficulty);
  const diffCat = pool.filter(d => d.category !== orig.category);
  const result = [];
  const seen = new Set();
  function pushUnique(d) { if (!d || seen.has(d.id)) return; seen.add(d.id); result.push(d); }
  if (sameCatSameLv.length) pushUnique(pickRandom(sameCatSameLv));
  if (sameCatDiffLv.length) pushUnique(pickRandom(sameCatDiffLv));
  if (diffCat.length) pushUnique(pickRandom(diffCat));
  while (result.length < 3 && result.length < pool.length) {
    const cands = pool.filter(d => !seen.has(d.id));
    if (!cands.length) break;
    pushUnique(pickRandom(cands));
  }
  return result;
}

// 残り候補数（除外を考慮）
function countRemainingAlternatives(drillId, currentMenuIds, filters, excluded) {
  const orig = getDrill(drillId);
  if (!orig) return 0;
  const exSet = new Set(excluded || []);
  return ALL_DRILLS.filter(d =>
    d.id !== orig.id && !currentMenuIds.includes(d.id) && !exSet.has(d.id) &&
    d.genre === orig.genre &&
    spaceOk(d, filters.space) && peopleOk(d, filters.people)
  ).length;
}

function compareTagsHtml(orig, alt) {
  const tags = [];
  if (alt.category === orig.category) tags.push('<span class="compare-tag same">同カテゴリ</span>');
  else tags.push(`<span class="compare-tag same">別:${escapeHtml(alt.category)}</span>`);
  const dn = diffNum(alt.difficulty) - diffNum(orig.difficulty);
  if (dn === 0) tags.push('<span class="compare-tag same">同レベル</span>');
  else if (dn > 0) tags.push(`<span class="compare-tag up">★+${dn}</span>`);
  else tags.push(`<span class="compare-tag down">★${dn}</span>`);
  const td = (alt.duration || 10) - (orig.duration || 10);
  if (td === 0) tags.push('<span class="compare-tag same">同時間</span>');
  else if (td > 0) tags.push(`<span class="compare-tag up">+${td}分</span>`);
  else tags.push(`<span class="compare-tag down">${td}分</span>`);
  return tags.join('');
}

function cleanupStaleIds() {
  const validIds = new Set(ALL_DRILLS.map(d => d.id));

  if (cleanedFavs.length !== favs.length) saveFavs(cleanedFavs);
  const last = loadLastMenu();
  if (last && Array.isArray(last.menu)) {
    const cleaned = last.menu.filter(id => validIds.has(id));
    if (cleaned.length !== last.menu.length) {
      last.menu = cleaned;
      saveLastMenu(last);
    }
  }
}

// ========== エクスポート/インポート ==========
function exportData(filename, data) {
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return true;
  } catch (e) {
    return false;
  }
}
function importData(callback) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        callback(data);
      } catch (err) {
        showToast('JSONの読み込みに失敗しました');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

    const stepKey = state.menuStepMap[id];
    const d = getDrill(id);
    
    // ステップが切り替わったらヘッダーを挿入
    if (stepKey && stepKey !== lastStepKey) {
      const step = ORDER_FLOW.find(s => s.key === stepKey);
      if (step) {
        const stepIdx = ORDER_FLOW.findIndex(s => s.key === stepKey);
        listHtml += `<div class="step-header">
          <span class="step-num">STEP ${(stepIdx + 1).toString().padStart(2,'0')}</span>
          <span class="step-name">${escapeHtml(step.label)}</span>
        </div>`;
      }
      lastStepKey = stepKey;
    } else if (!stepKey && lastStepKey !== 'manual') {
      // 手動追加分のヘッダー
      listHtml += `<div class="step-header">
        <span class="step-num" style="background:var(--red);color:var(--paper)">追加</span>
        <span class="step-name">手動追加</span>
      </div>`;
      lastStepKey = 'manual';
    }
    
    listHtml += renderDrillCard(id, idx);
    
    // 並行カードがあれば追加
    const parallelId = state.menuParallel[id];
    if (parallelId) {
      listHtml += renderParallelCard(parallelId, id);
    }
    
    listHtml += `<button class="add-slot" data-add-at="${idx + 1}">＋ ここに追加</button>`;
  });
  
  return `
    <button class="back-btn" data-go="home">← BACK</button>
    <h2>EDITOR</h2>
    <div class="summary-bar">
      <div class="item"><span class="label">種目</span><span class="val">${state.menu.length}</span></div>
      <div class="item"><span class="label">合計</span><span class="val">${total}分</span></div>
      <div class="item"><span class="label">スペース</span><span class="val" style="font-size:14px">${f.space}</span></div>
      <div class="item"><span class="label">人数</span><span class="val">${f.people}</span></div>
    </div>
    <div class="btn-row" style="margin-bottom:18px">
      <button class="btn small warn" data-action="regenerate">↻ 再生成</button>
      <button class="btn small" data-go="interview">条件を変える</button>
      <button class="btn small primary" data-action="save-history">📅 履歴に保存</button>
    </div>
    <button class="add-slot" data-add-at="0" style="margin-bottom:8px">＋ 先頭に追加</button>
    <div class="menu-list">${listHtml}</div>
  `;
}

function renderDrillCard(id, idx) {
  const d = getDrill(id);
  if (!d) return '';
  const isFav = state.favorites.includes(id);
  const isOpen = state.expandedId === id + '@' + idx;
  const sato = isSato(d);
  const locked = isLockedDrill(d);
  
  const actions = locked
    ? `<span class="badge-locked">FIXED</span>
       <button class="icon-btn" title="alt" data-show-alt="${idx}">≈</button>
       <button class="icon-btn ${isFav ? 'fav-on' : ''}" title="fav" data-toggle-fav="${id}">${isFav ? '♥' : '♡'}</button>`
    : `${idx > 0 && !isLockedDrill(getDrill(state.menu[idx-1])) ? `<button class="icon-btn" title="up" data-move-up="${idx}">↑</button>` : ''}
       ${idx < state.menu.length - 1 ? `<button class="icon-btn" title="down" data-move-down="${idx}">↓</button>` : ''}
       <button class="icon-btn" title="alt" data-show-alt="${idx}">≈</button>
       <button class="icon-btn ${isFav ? 'fav-on' : ''}" title="fav" data-toggle-fav="${id}">${isFav ? '♥' : '♡'}</button>
       <button class="icon-btn danger" title="del" data-remove="${idx}">×</button>`;
  
  return `
    <div class="drill-card ${locked ? 'locked' : ''}">
      <div class="drill-num">${(idx + 1).toString().padStart(2,'0')}</div>
      <div class="drill-body">
        <div class="drill-genre-row">
          <span class="genre-chip">${escapeHtml(d.genre)}</span>
          <span class="cat-chip">${escapeHtml(d.category || '')}</span>

        </div>
        <div class="drill-name" data-toggle-detail="${id}@${idx}">${escapeHtml(d.name)}</div>
        <div class="drill-meta">
          <span class="meta-tag diff">${escapeHtml(d.difficulty || '')}</span>
          <span class="meta-tag time">${d.duration || '?'}分</span>
          <span class="meta-tag">${escapeHtml(d.space || '')}</span>

        </div>
        ${isOpen ? renderDrillDetail(d) : ''}

  `;
}

function renderManualPick() {
  const f = state.filters;
  const m = state.manual;
  const g = m.selectedGenre;
  if (!g) { state.view = 'manual-genres'; return ''; }
  let pool = ALL_DRILLS.filter(d =>
    d.genre === g && spaceOk(d, f.space) && peopleOk(d, f.people) && levelMatch(d, f.level)
  );
  if (m.cat) pool = pool.filter(d => d.category === m.cat);
  if (m.q) {
    const q = m.q.toLowerCase();
    pool = pool.filter(d => (d.name || '').toLowerCase().includes(q) || (d.purpose || '').toLowerCase().includes(q));
  }
  // 佐藤定番優先表示
  if (m.preferSato) pool = sortSatoFirst(pool);
  
  // カテゴリ別にグルーピング（佐藤定番優先表示時はソート済みの順序を保つ）
  const byCat = {};
  for (const d of pool) {
    if (!byCat[d.category]) byCat[d.category] = [];
    byCat[d.category].push(d);
  }
  const allCats = [...new Set(ALL_DRILLS.filter(d => d.genre === g).map(d => d.category))].sort();
  const catOpts = ['', ...allCats].map(c => `<option value="${c}" ${m.cat===c?'selected':''}>${c || '全カテゴリ'}</option>`).join('');
  const groupHtml = Object.entries(byCat).map(([cat, drills]) => `
    <div class="cat-group">
      <div class="cat-title">${escapeHtml(cat)}<span class="cat-num">${drills.length}件</span></div>
      <div class="menu-list">${drills.map(d => renderPickCard(d)).join('')}</div>
    </div>
  `).join('');
  const inMenuCount = state.menu.filter(id => {
    const d = getDrill(id); return d && d.genre === g;
  }).length;
  return `
    <button class="back-btn" data-go="manual-genres">← ジャンル選択</button>
    <h2>${escapeHtml(g)}</h2>
    <p style="margin-bottom:14px;font-size:13px;color:var(--text-secondary)">条件に合う ${pool.length}件 ${inMenuCount > 0 ? `／ このジャンル${inMenuCount}選択中` : ''}</p>
    <div class="filter-bar">
      <input type="text" class="search" id="manual-q" placeholder="検索..." value="${escapeHtml(m.q)}">
      <select id="manual-cat">${catOpts}</select>
    </div>
    ${pool.length === 0 ? `<p style="padding:30px;text-align:center;color:var(--text-secondary)">条件に合うドリルがありません。</p>` : groupHtml}
    <div class="sticky-footer">
      <div class="sticky-info">
        <span class="sticky-num">${state.menu.length}</span>
        <span class="sticky-label">SELECTED</span>
      </div>
      <button class="btn small" data-go="manual-genres">他のジャンル</button>
      ${state.menu.length > 0 ? `<button class="btn small primary" data-go="editor">編集 →</button>` : ''}
    </div>
  `;
}

function renderCustomForm() {
  const ed = state.editingDrill || {};
  const isEdit = !!ed.id;
